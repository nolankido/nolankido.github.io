# Existing branch-based GitHub Pages publishing remains unchanged.
include:
  - .well-known
exclude:
  - _source
  - _scripts
  - _tests
  - README.md
  - DESIGN_HANDOFF.md
  - DESIGN_IMPLEMENTATION.md
  - EDITORIAL_GUIDE.md
  - CONTENT_RELEASE.md
  - SITE_REVIEW.md
  - requirements-test.txt

# Keep editable Markdown worksheets as static downloads.
optional_front_matter:
  enabled: false
