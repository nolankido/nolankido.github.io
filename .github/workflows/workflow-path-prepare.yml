name: Prepare practical AI workflow path
on:
  push:
    branches: [codex/ai-workflow-path-20261012]
    paths: [.github/workflows/workflow-path-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/ai-workflow-path-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve a separate copy of original production
        run: |
          test "$(git rev-parse 0ffc618d4b2b390f61dccde466aca60375600d43^{tree})" = '430acf15437692935bb2662dda21255415aa5a76'
          mkdir -p "$RUNNER_TEMP/workflow-original"
          git archive 0ffc618d4b2b390f61dccde466aca60375600d43 | tar -x -C "$RUNNER_TEMP/workflow-original"
      - name: Apply the hash-bound reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_workflow-path-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(2))
          assert len(encoded) == 19320
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 50172
          assert hashlib.sha256(raw).hexdigest() == '371607770fec5143bd8de7becfb7dd94195b5593cafb5c2217f243ebc970f0e8'
          Path('/tmp/workflow-path.patch').write_bytes(raw)
          PY
          git apply --check /tmp/workflow-path.patch
          git apply /tmp/workflow-path.patch
      - name: Capture independent historical signatures
        run: |
          python _scripts/capture_workflow_baseline.py --original-root "$RUNNER_TEMP/workflow-original" --output _tests/workflow-path-baseline.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('_tests/workflow-path-baseline.json').read_bytes()).hexdigest() == '1250f2099d74cfc1e3a30812e545323c637e6635b0c0326e01d9f8abc8e62608'
          PY
      - name: Build and validate the candidate
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit content to the isolated branch
        run: |
          rm -rf _workflow-path-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Connect existing AI resources into a usable workflow and exact workbook'
          git push origin HEAD:refs/heads/codex/ai-workflow-path-20261012
          git archive --format=tar --output=/tmp/workflow-path-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-path-candidate
          path: /tmp/workflow-path-candidate.tar
          retention-days: 1
