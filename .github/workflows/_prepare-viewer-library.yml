name: Prepare Poker viewer library
on:
  push:
    branches: [site/poker-viewer-library-20261005]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed public source and check examples
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/viewer-library-evidence"
          python _scripts/_prepare_viewer_library.py
          python _scripts/build.py --check
          # Existing layout emits a whitespace-only line in generated pages.
          # Check authored sources without changing the preserved shared layout.
          git diff --check --cached -- _source _scripts _tests assets downloads README.md VIEWER_LIBRARY_RELEASE.md _config.yml
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/viewer-library-evidence/unit.log"
          node --check assets/contact.js
      - name: Install browser and accessibility test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Browser, guide navigation, disclosures, and downloads
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/viewer-library-evidence/screenshots
        run: |
          set -euo pipefail
          python _tests/browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-library-evidence/browser.log"
          python _tests/design_browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-library-evidence/design.log"
      - name: Accessibility and existing populated publishing paths
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          REVIEW_OUTPUT: ${{ runner.temp }}/viewer-library-evidence/accessibility.json
        run: |
          set -euo pipefail
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-library-evidence/review.log"
          python _tests/poker_browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-library-evidence/populated.log"
      - name: Package tested release
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, zipfile
          root = Path.cwd()
          expected = 'cd9e1ca03d61081937daa5a4c097f3459b74ed6f'
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != expected:
              raise SystemExit('Tests changed the reviewed tree: ' + tree)
          out = Path(os.environ['RUNNER_TEMP']) / 'viewer-library-evidence'
          (out / 'tested-tree.txt').write_text(tree + '\n')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(out / 'website.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for relative in paths:
                  if relative:
                      z.write(root / relative, relative)
          PY
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-viewer-library-review
          path: ${{ runner.temp }}/viewer-library-evidence
          retention-days: 7
      - name: Commit only tested release to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add seven practical Poker viewer guides and visual learning examples'
          git push origin HEAD:site/poker-viewer-library-20261005
