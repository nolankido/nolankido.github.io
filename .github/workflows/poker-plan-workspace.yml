name: Poker plan workspace snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'poker-content-plan-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked public source for the editing workspace
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/poker-plan-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-plan-source
          path: ${{ runner.temp }}/poker-plan-source.tar.gz
          retention-days: 1
          if-no-files-found: error
