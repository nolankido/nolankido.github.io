name: Poker School branch-only generated-site sync
on:
  push:
    branches: [improve-poker-school-interest-20261016]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate and check project outputs
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_poker_school.py' -v
          node --check assets/contact.js
      - name: Commit generated outputs only to this improvement branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated change required."
          else
            git commit -m "Build Poker School site outputs"
            git push origin HEAD:improve-poker-school-interest-20261016
          fi
