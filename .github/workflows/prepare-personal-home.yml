name: Prepare personal home on alternate runner
on:
  push:
    branches: [personal-home-fallback-20261005]
permissions:
  contents: write
concurrency:
  group: prepare-personal-home-fallback
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare and validate public source
        run: |
          python _scripts/prepare_content.py
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium
      - name: Contact regressions and real page checks
        run: |
          python _tests/browser.py
          python _tests/design_browser.py
      - name: Real font layout checks
        env:
          ALLOW_WEB_FONTS: '1'
        run: python _tests/design_browser.py
      - name: Commit only verified source and output to staging
        run: |
          test "$GITHUB_REF_NAME" = 'personal-home-fallback-20261005'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _source _tests README.md _config.yml index.html about bio card contact privacy 404.html notes resources feed.xml sitemap.xml nolan-kido.vcf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate and verify personal-home content and resource revision'
            git push origin HEAD:refs/heads/personal-home-fallback-20261005
          fi
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
          echo "VERIFIED_TREE=$(git rev-parse HEAD^{tree})"
