name: Public image preparation
on:
  push:
    branches: [site/public-judgment-20261011]
    paths: [.github/workflows/public-image-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/site/public-judgment-20261011'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare source and reviewed static graphics
        run: |
          python -m pip install Pillow==11.3.0
          python _scripts/apply_public_image.py
          python _scripts/build.py --check
      - name: Unit and content regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/public-image-unit.log"
      - name: Commit only site changes to the review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='site/public-judgment-20261011'
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          git rm _scripts/apply_public_image.py
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clarify public judgment, publish original essay and improve reading presentation'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$RUNNER_TEMP/public-image-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/public-image-release.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-image-prepared
          path: |
            ${{ runner.temp }}/public-image-unit.log
            ${{ runner.temp }}/public-image-head.txt
            ${{ runner.temp }}/public-image-release.tar.gz
          retention-days: 1
