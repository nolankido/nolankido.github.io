name: Prepare interest entry points
on:
  push:
    branches: [site/interest-entrypoints-20261011]
    paths:
      - _scripts/entrypoints-patch.part*
      - .github/workflows/entrypoints-preparation.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/site/interest-entrypoints-20261011'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source patch and build
        shell: bash
        run: |
          set -euo pipefail
          cat _scripts/entrypoints-patch.part1 _scripts/entrypoints-patch.part2 _scripts/entrypoints-patch.part3 > "$RUNNER_TEMP/entrypoints.patch.gz"
          echo "c36376528bbb8cdefa4d0ddaca9e3f640455688335c34a9cc1211aed9a01c688  $RUNNER_TEMP/entrypoints.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/entrypoints.patch.gz" > "$RUNNER_TEMP/entrypoints.patch"
          git apply --check "$RUNNER_TEMP/entrypoints.patch"
          git apply "$RUNNER_TEMP/entrypoints.patch"
          python _scripts/build.py
          python _scripts/build.py --check
      - name: Unit and content regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/entrypoints-unit.log"
      - name: Commit site files to isolated review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='site/interest-entrypoints-20261011'
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          git rm _scripts/entrypoints-patch.part1 _scripts/entrypoints-patch.part2 _scripts/entrypoints-patch.part3
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git diff --cached --stat > "$RUNNER_TEMP/entrypoints-changes.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect interests, resources, and contextual next reading'
          git rev-parse HEAD > "$RUNNER_TEMP/entrypoints-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/entrypoints-release.tar.gz"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: entrypoints-prepared
          path: |
            ${{ runner.temp }}/entrypoints-unit.log
            ${{ runner.temp }}/entrypoints-changes.txt
            ${{ runner.temp }}/entrypoints-head.txt
            ${{ runner.temp }}/entrypoints-release.tar.gz
          retention-days: 1
