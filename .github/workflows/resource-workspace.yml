name: Resource workspace source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'poker-resource-quality-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/resource-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-source
          path: ${{ runner.temp }}/resource-source.tar.gz
          retention-days: 1
          if-no-files-found: error
