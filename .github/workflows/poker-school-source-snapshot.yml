name: Temporary Poker School source snapshot
on:
  push:
    branches: [improve-poker-school-interest-20261016]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package checkout for release compatibility inspection
        run: |
          tar --exclude=./.git/objects/pack --exclude=./.git/index.lock -czf "$RUNNER_TEMP/poker-school-checkout.tar.gz" .
          ls -lh "$RUNNER_TEMP/poker-school-checkout.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-school-checkout
          path: ${{ runner.temp }}/poker-school-checkout.tar.gz
          retention-days: 1
          if-no-files-found: error
