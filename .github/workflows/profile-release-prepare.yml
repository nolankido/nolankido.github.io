name: Prepare public profile release
on:
  push:
    branches: [codex/profile-core-20261011]
    paths: [.github/workflows/profile-release-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/profile-core-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_profile-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(2))
          assert len(encoded) == 22304
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 56192
          assert hashlib.sha256(raw).hexdigest() == '261b0787375f5b326225ed64901bffe56eaf69b58cf1050db874e99915d5c08a'
          Path('/tmp/profile.patch').write_bytes(raw)
          PY
          git apply --check /tmp/profile.patch
          git apply /tmp/profile.patch
      - name: Build and validate the candidate
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          node --check assets/public-profile.js
          python -m unittest discover -s _tests -p test_public_profile.py -v
      - name: Commit content without changing workflows
        run: |
          rm -rf _profile-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Improve public introductions and consolidate core styling'
          git push origin HEAD:refs/heads/codex/profile-core-20261011
          git archive --format=tar --output=/tmp/profile-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-candidate
          path: /tmp/profile-candidate.tar
          retention-days: 1
