name: Living Well branch verification
on:
  push:
    branches: [living-well-initial-build-20261008]
permissions:
  contents: read
concurrency:
  group: living-well-initial-build
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/living-well-initial-build-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Integrate, build and test without touching main
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/living-well-checks"
          python _scripts/install_living_well.py 2>&1 | tee "$RUNNER_TEMP/living-well-checks/integration.log"
          python _scripts/finalize_living_well.py 2>&1 | tee "$RUNNER_TEMP/living-well-checks/finalization.log"
          python _scripts/build.py --check 2>&1 | tee "$RUNNER_TEMP/living-well-checks/build.log"
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/living-well-checks/unit.log"
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Verify Living Well reader paths and accessibility
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/living-well-checks
        run: |
          set -o pipefail
          python _tests/living_well_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-checks/browser.log"
      - name: Commit verified generated source and output to this branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'living-well-initial-build-20261008'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified Living Well source and static output on review branch'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/living-well-checks/verified-source-head.txt"
      - name: Export checked source and diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/living-well-checks"
          tar --exclude=.git --exclude=__pycache__ -cf "$RUNNER_TEMP/living-well-checks/living-well-source.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: living-well-checks
          path: ${{ runner.temp }}/living-well-checks/
          retention-days: 1
          if-no-files-found: error
