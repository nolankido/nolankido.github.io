name: Search review snapshot
on:
  push:
    branches: [codex/search-identity-20261011]
    paths: [.github/workflows/search-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source
        run: git archive --format=tar --output=/tmp/nolankido-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: search-review-source
          path: /tmp/nolankido-source.tar
          retention-days: 1
