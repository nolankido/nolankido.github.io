name: Prepare fingerprinted profile datetime repair
on:
  push:
    branches: [helper-profile-datetime-prepare-20261020]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3d58eef8d5d878885bfbcfe67b6565a17cd9defb
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore checksum-verified transfer without executing its envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 3d58eef8d5d878885bfbcfe67b6565a17cd9defb
          gh api 'repos/nolankido/nolankido.github.io/contents/.github/workflows/profile-datetime-prepare.yml?ref=df24f3f6b1caaf47f1550a9496a880c30f02728c' --jq .content | base64 -d > /tmp/transfer-envelope.txt
          python - <<'PY'
          import base64, hashlib, pathlib, re, subprocess, zlib
          envelope = pathlib.Path('/tmp/transfer-envelope.txt').read_text()
          matches = re.findall("encoded = '''(.*?)'''", envelope, re.S)
          assert len(matches) == 1
          encoded = matches[0]
          # Normalize one known transcription error in the transport only.
          # Both the decoded patch hash and the final tree are independent gates.
          assert encoded.count('V0luRWU4Ytx') == 1
          encoded = encoded.replace('V0luRWU4Ytx', 'V0luRW4Ytx', 1)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '955266dae30cb44c11594f32bc8ffdab50f7293ce3b138d9bfcd78e35cdef0d4'
          path = pathlib.Path('/tmp/profile-datetime.patch'); path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
          python _scripts/build.py
      - name: Reproduce exact predecessor record
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          H = lambda b: hashlib.sha256(b).hexdigest()
          record = {'version': 1, 'base_commit': '3d58eef8d5d878885bfbcfe67b6565a17cd9defb', 'paths': {}}
          for p in ['_scripts/search_visibility.py', 'about/index.html']:
              old = subprocess.check_output(['git', 'show', 'HEAD:' + p])
              new = pathlib.Path(p).read_bytes()
              record['paths'][p] = {'old_sha256': H(old), 'new_sha256': H(new), 'old_zlib_base64': base64.b64encode(zlib.compress(old, 9)).decode()}
          protected = []
          for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not p or p.startswith(('_tests/', '_reports/')): continue
              protected.append([p, H(subprocess.check_output(['git', 'show', 'HEAD:' + p]))])
          record['production_count'] = len(protected)
          record['production_fingerprint'] = H(json.dumps(sorted(protected), separators=(',', ':')).encode())
          pathlib.Path('_tests/profile-datetime-change.json').write_text(json.dumps(record, indent=2) + '\n')
          assert len(protected) == 714
          PY
      - name: Verify exact tree and focused behavior
        run: |
          set -eu
          python -m pip install html5lib==1.1
          python -m unittest discover -s _tests -p test_profile_datetime.py -v
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          git add _reports/website-growth/turn-13-profile-datetime.md _scripts/search_visibility.py _tests/profile-datetime-change.json _tests/profile_datetime_history.py _tests/test_profile_datetime.py _tests/test_turn11_task_navigation.py _tests/test_weekly_reset_turn09.py _tests/turn09_weekly_reset_history.py about/index.html
          test "$(git write-tree)" = fa114f41299e0459700a39e18c82f246230a71aa
          git diff --cached --check
      - name: Save create-only candidate branch, never main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 3d58eef8d5d878885bfbcfe67b6565a17cd9defb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Omit unsourced clock time from optional ProfilePage modification markup' -m 'Preserve the biography, visible page, original editorial day, sitemap and every other public output. Add exact-scope regression protection; no invented timestamp or search outcome.'
          git push --force-with-lease=refs/heads/website-growth-turn13-profile-datetime-20261020: origin HEAD:refs/heads/website-growth-turn13-profile-datetime-20261020
          echo "PREPARED_COMMIT=$(git rev-parse HEAD)"
          echo "PREPARED_TREE=$(git rev-parse HEAD^{tree})"
