name: Prepare exact public-page feedback candidate
on:
  push:
    branches: [helper-feedback-context-prepare-20261021]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      BASE: 9ada5f1041f54a311f5142cb520d5f75edf3e2cd
      EXPECTED_TREE: 01a2456802afc4594015d57f0319406c2564fa26
      CANDIDATE_BRANCH: website-growth-turn14-feedback-context-20261021
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve checksum-verified patch outside the checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os, zlib
          raw = Path('_reports/transfers/feedback-context.patch.zlib').read_bytes()
          patch = zlib.decompress(raw)
          assert sha256(patch).hexdigest() == 'c2c97e301b02fcb444934f59448c60a94dd0da7214a8678bb07a8e267b343b26'
          assert len(patch) == 36362
          Path(os.environ['RUNNER_TEMP'], 'feedback.patch').write_bytes(patch)
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          git apply --check "$RUNNER_TEMP/feedback.patch"
          git apply "$RUNNER_TEMP/feedback.patch"
      - name: Regenerate only the reviewed public outputs
        run: |
          python _scripts/build.py
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os, subprocess, json, base64, difflib, itertools
          root = Path('.')
          def old(path):
              return subprocess.check_output(['git', 'show', 'HEAD:' + path])
          def digest(value):
              return sha256(value).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-tree', '-rz', '--name-only', 'HEAD']).decode().split('\0')
          prod = [p for p in tracked if p and not p.startswith(('_tests/', '_reports/'))]
          assert len(prod) == 714
          expected = {'_scripts/build.py', '_source/contact.html', 'assets/contact.js', 'contact/index.html',
                      'technology/task-brief/index.html', 'technology/check-ai-answers/index.html',
                      'technology/ai-time-savings/index.html', 'living-well/weekly-reset/index.html',
                      'poker/first-live-tournament/index.html', 'poker/hand-rankings/index.html'}
          changed = [p for p in prod if old(p) != (root / p).read_bytes()]
          assert set(changed) == expected, changed
          paths = {}
          for name in changed:
              before, after = old(name), (root / name).read_bytes()
              a, b = before.splitlines(keepends=True), after.splitlines(keepends=True)
              positions = [0] + list(itertools.accumulate(map(len, b)))
              edits = []
              for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(None, a, b, autojunk=False).get_opcodes():
                  if tag != 'equal':
                      edits.append([positions[j1], positions[j2], base64.b64encode(b''.join(a[i1:i2])).decode()])
              paths[name] = {'old_sha256': digest(before), 'new_sha256': digest(after), 'edits': edits}
          inventory = [(p, digest(old(p))) for p in prod]
          record = {'version': 1, 'base_commit': os.environ['BASE'], 'paths': paths,
                    'production_count': len(prod),
                    'production_fingerprint': digest(json.dumps(sorted(inventory), separators=(',', ':')).encode())}
          (root / '_tests/feedback-context-change.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github)"
      - name: Qualify generated output and focused contracts
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p 'test_feedback_context.py' -v
          PYTHONPATH=_tests python -m unittest test_weekly_reset_turn09 test_time_decision test_profile_datetime -v
          node --check assets/contact.js
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Create a new candidate branch without touching main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CANDIDATE_BRANCH" = website-growth-turn14-feedback-context-20261021
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Carry explicit public-page context into reader correction reports' -m 'Six fixed identifiers, editable optional context, no private tool input or automatic submission. Preserve existing service, verification, ordinary contact and historical hashes. Candidate requires full hosted release qualification.'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:" "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
