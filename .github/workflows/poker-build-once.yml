name: Assemble Poker source update
on:
  pull_request:
permissions:
  contents: read
jobs:
  assemble:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/poker-topic-architecture-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/poker-topic-architecture-20261008
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply integrity-checked source changes
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, lzma
          parts = [Path(f'.github/topic-source/part-{i}.bin') for i in range(4)]
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == 'd6bac4bcdb7f814daa2ba70a5e8811e4f18dbc847eecfcb5507ab895f68312c9'
          raw = lzma.decompress(packed, memlimit=64 * 1024 * 1024)
          assert len(raw) < 250000
          data = json.loads(raw)
          assert set(data) == {'changes', 'workflow'} and len(data['changes']) == 24
          assert Path('.github/workflows/site-checks.yml').read_text(encoding='utf-8') == data['workflow']
          staged = {}
          for name, change in data['changes'].items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'_source', '_scripts', '_tests', 'assets', '_reports'} or name == 'README.md'
              target = Path(name)
              assert target.exists() == (change['before'] is not None), name
              original = target.read_text(encoding='utf-8') if target.exists() else ''
              if change['before'] is not None:
                  assert hashlib.sha256(original.encode()).hexdigest() == change['before'], name
              last = 0
              for start, end, replacement in change['edits']:
                  assert isinstance(start, int) and isinstance(end, int) and isinstance(replacement, str)
                  assert 0 <= last <= start <= end <= len(original), name
                  last = end
              result = original
              for start, end, replacement in reversed(change['edits']):
                  result = result[:start] + replacement + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == change['after'], name
              staged[target] = result
          for target, result in staged.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(result, encoding='utf-8')
          for part in parts:
              part.unlink()
          parts[0].parent.rmdir()
          print(f'Applied {len(staged)} source files with before/after integrity verification')
          PY
      - name: Build and validate generated output
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/poker-finder.js
          git diff --exit-code -- index.html about contact technology creative privacy _source/layout.html _source/poker/resources.json styles.css assets/contact.js assets/site.css
      - name: Commit only to the isolated working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build and validate Poker topic architecture'
          git push origin HEAD:refs/heads/codex/poker-topic-architecture-20261008
          echo "ASSEMBLED_COMMIT=$(git rev-parse HEAD)"
