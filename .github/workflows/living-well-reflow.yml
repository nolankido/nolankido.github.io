name: Living Well reflow correction
on:
  push:
    branches: [living-well-initial-build-20261008]
permissions:
  contents: read
concurrency:
  group: living-well-reflow-correction
  cancel-in-progress: false
jobs:
  reflow:
    if: github.ref == 'refs/heads/living-well-initial-build-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the reviewed reflow correction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('_scripts/living_well.py')
          text = p.read_text()
          old, new = 'Connected, not interchangeable', 'Another way in.'
          if old in text:
              assert text.count(old) == 1
              p.write_text(text.replace(old, new))
          else:
              assert new in text
          p = Path('assets/living-well.css')
          text = p.read_text()
          addition = '\n/* Long headings must remain readable with user-defined text spacing. */\n.lw-section h2, .lw-section h3, .lw-article h2 { overflow-wrap: anywhere; }\n'
          if addition not in text:
              p.write_text(text + addition)
          p = Path('_tests/living_well_browser.py')
          text = p.read_text()
          old = '''                    if width == 390:
                                  spacing = page.add_style_tag(content='* { line-height:1.5!important; letter-spacing:.12em!important; word-spacing:.16em!important; } p { margin-bottom:2em!important; }')
                                  assert page.evaluate('document.documentElement.scrollWidth') <= width, ('text spacing', entry['path'])
                                  spacing.evaluate('(node) => node.remove()')
                                  if os.environ.get('AXE_PATH'):'''
          # Construct exact indentation independently of YAML block indentation.
          old = '\n'.join((' ' * 20 + 'if width == 390:', ' ' * 24 + "spacing = page.add_style_tag(content='* { line-height:1.5!important; letter-spacing:.12em!important; word-spacing:.16em!important; } p { margin-bottom:2em!important; }')", ' ' * 24 + "assert page.evaluate('document.documentElement.scrollWidth') <= width, ('text spacing', entry['path'])", ' ' * 24 + "spacing.evaluate('(node) => node.remove()')", ' ' * 24 + "if os.environ.get('AXE_PATH'):"))
          new = '\n'.join((' ' * 20 + "spacing = page.add_style_tag(content='* { line-height:1.5!important; letter-spacing:.12em!important; word-spacing:.16em!important; } p { margin-bottom:2em!important; }')", ' ' * 20 + "assert page.evaluate('document.documentElement.scrollWidth') <= width, ('text spacing', entry['path'])", ' ' * 20 + "spacing.evaluate('(node) => node.remove()')", ' ' * 20 + 'if width == 390:', ' ' * 24 + "if os.environ.get('AXE_PATH'):"))
          if old in text:
              assert text.count(old) == 1
              p.write_text(text.replace(old, new))
          else:
              assert new in text
          p = Path('_source/living-well/RELEASE.md')
          text = p.read_text()
          if '## Narrow-screen text-spacing correction' not in text:
              text += '\n## Narrow-screen text-spacing correction\n\nThe retained whole-site audit caught overflow in the shared closing heading on all five topic pages at 320 CSS pixels with user-defined text spacing. The heading was shortened, Living Well section and article headings gained safe wrapping, and the dedicated browser regression now applies text-spacing overrides at every tested width rather than only 390 pixels. All existing accessibility and whole-site regression gates remain required.\n'
              p.write_text(text)
          PY
      - name: Build and run all automated tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/living-well-reflow"
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/living-well-reflow/unit.log"
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Verify reflow and reader paths
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/living-well-reflow
        run: |
          set -o pipefail
          python _tests/living_well_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-reflow/browser.log"
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-reflow/review.log"
      - name: Commit verified output to review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'living-well-initial-build-20261008'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve Living Well heading reflow under expanded text spacing'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/living-well-reflow/verified-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: living-well-reflow
          path: |
            ${{ runner.temp }}/living-well-reflow/*.log
            ${{ runner.temp }}/living-well-reflow/*.json
            ${{ runner.temp }}/living-well-reflow/*.txt
            ${{ runner.temp }}/living-well-reflow/living-well-*.png
          retention-days: 1
          if-no-files-found: error
