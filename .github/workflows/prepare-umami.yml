name: Prepare Umami installation
on:
  push:
    branches: [install-umami-20261006]
    paths: ['.github/workflows/prepare-umami.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: install-umami-20261006
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the pinned installation and verify the exact change scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          def replace_once(name, old, new):
              path = Path(name)
              content = path.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one replacement target')
              path.write_text(content.replace(old, new), encoding='utf-8')

          # Reuse the reviewed source patch from this feature branch's first commit.
          # This workflow is temporary and will be removed before merging to main.
          source = subprocess.check_output(['git', 'show', 'ea61cabe22284dc17183bc6baa262eb4d6bfa9f0:.github/workflows/prepare-umami.yml'], text=True)
          start = '      - name: Apply narrowly scoped source changes\n        run: |\n'
          end = '      - name: Generate and validate public files\n'
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('Pinned installation boundaries changed')
          script = textwrap.dedent(source.split(start, 1)[1].split(end, 1)[0])
          paths = subprocess.check_output(['git', 'ls-files', '*.html'], text=True).splitlines()
          before = {name: Path(name).read_bytes() for name in paths if not name.startswith(('_source/', '_tests/'))}
          subprocess.run(['bash', '-e', '-c', script], check=True)
          subprocess.run(['python', '_scripts/build.py'], check=True)
          tracker = b'  <script defer src="https://cloud.umami.is/script.js" data-website-id="51bfd4d7-08ac-4299-924b-621af60fa7f1" data-domains="nolankido.com,www.nolankido.com" data-do-not-track="true" data-exclude-search="true" data-exclude-hash="true"></script>\n'
          verified = 0
          for name, old in before.items():
              current = Path(name).read_bytes()
              if name == 'privacy/index.html':
                  continue
              if old.count(b'</head>') != 1 or current != old.replace(b'</head>', tracker + b'</head>'):
                  raise SystemExit(f'Unexpected non-analytics HTML change: {name}')
              verified += 1
          print(f'Confirmed {verified} existing HTML pages differ only by the approved tracker; privacy changes reviewed separately.')

          # Keep the strict script allowlist, adding exactly the approved provider.
          old = "            self.assertEqual(sources, ['/assets/contact.js?v=' + hashlib.sha256((ROOT / 'assets/contact.js').read_bytes()).hexdigest()[:12]] if path == Path('contact/index.html') else [])"
          new = "            expected = (['/assets/contact.js?v=' + hashlib.sha256((ROOT / 'assets/contact.js').read_bytes()).hexdigest()[:12]] if path == Path('contact/index.html') else []) + ['https://cloud.umami.is/script.js']\n            self.assertEqual(sources, expected)"
          replace_once('_tests/test_content.py', old, new)
          replace_once('_tests/test_content.py', 'test_no_new_tracking_scripts_and_no_private_worksheet_form', 'test_only_approved_scripts_and_no_private_worksheet_form')

          # Refresh only the fingerprints affected by the explicit analytics install.
          # These expected values were observed in the first build; the independent
          # byte comparison above rejects any unrelated page or design changes.
          replace_once('_tests/test_poker_content.py', "BASELINE_DIGEST = '184aa81c86236e6ffeae71fb36d8aa87a1c1e39462d1ffdf69d8f908356c9c9a'", "# October 6: approved Umami tag and privacy disclosure; other page bytes verified unchanged.\nBASELINE_DIGEST = 'e542fb7aef01076db1a1cd3dfbe9a76dde579465d12e1e063febd82696087c25'")
          replace_once('_tests/test_viewer_next.py', '8de9ffa71f89981ce94ead6ea8743c1c2ef9c5a8a12f15f5533ead462d9c8690', '168617f68c7315efe2c0653421117f4c72c78ebd7a1b1eec7551f7e724b62edc')
          replace_once('_tests/test_viewer_next.py', 'bad1290cc58638ab9e00187c9322dc86493aefa1b84835f18881210c255f2ef8', '7e521399e213c90d0f94cfbcc0d069ecc199b3d28420ccf0397b88202a5fb519')
          replace_once('_tests/test_viewer_next.py', '861519815edc48b8cc18d1e9d2ced9dd27855d453909df1d0748e64407f60cea', '0eacad4edf721e7a4e4256def4aae5b0f9c572f462df8b6b906023e50cbf4ce0')
          replace_once('_tests/test_viewer_next.py', "PROTECTED={'_source/", "# October 6: gateway hashes include only the approved Umami tag; design/source hashes are unchanged.\nPROTECTED={'_source/")
          PY
      - name: Validate public files and all unit tests
        run: |
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
          git diff --check
      - name: Commit the validated installation on the feature branch only
        run: |
          test "$GITHUB_REF_NAME" = 'install-umami-20261006'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add ANALYTICS.md _tests/test_analytics.py
          git diff --cached --stat
          git commit -m 'Install privacy-oriented Umami pageview analytics across the shared site'
          git push origin HEAD:refs/heads/install-umami-20261006
