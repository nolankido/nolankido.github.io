name: Prepare follow-on viewer guides
on:
  push:
    branches: [site/poker-viewer-next-20261005]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare and independently check examples
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/viewer-next-evidence"
          python _scripts/_prepare_viewer_next.py
          python _scripts/build.py --check
          git diff --cached --check -- _source _scripts _tests assets downloads README.md VIEWER_NEXT_RELEASE.md _config.yml
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/viewer-next-evidence/unit.log"
          node --check assets/contact.js
      - name: Install browser and accessibility test tools
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Reader routes, practice answers, and download tests
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/viewer-next-evidence/screenshots
        run: |
          set -euo pipefail
          python _tests/browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-next-evidence/browser.log"
          python _tests/design_browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-next-evidence/design.log"
      - name: Accessibility and existing episode publishing
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          REVIEW_OUTPUT: ${{ runner.temp }}/viewer-next-evidence/accessibility.json
        run: |
          set -euo pipefail
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-next-evidence/review.log"
          python _tests/poker_browser.py 2>&1 | tee "$RUNNER_TEMP/viewer-next-evidence/populated.log"
      - name: Package tested source
        run: |
          set -euo pipefail
          python _scripts/build.py --check
          git add -A
          test "$(git write-tree)" = 4b0eed03c6607dbca21f13cd02672ab18125ffc9
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, zipfile
          target = Path(os.environ['RUNNER_TEMP']) / 'viewer-next-evidence' / 'website.zip'
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as output:
              for name in files:
                  if name and Path(name).is_file():
                      output.write(name, name)
          PY
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-viewer-next-review
          path: ${{ runner.temp }}/viewer-next-evidence
          retention-days: 7
      - name: Commit only tested release to staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git write-tree)" = 4b0eed03c6607dbca21f13cd02672ab18125ffc9
          git commit -m 'Expand Poker viewer guides with reading routes and follow-along practice'
          git push origin HEAD:site/poker-viewer-next-20261005
