name: Full Poker resource workspace
on:
  push:
    branches: [poker-full-resource-20261008]
permissions:
  contents: write
concurrency:
  group: full-poker-resource-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/poker-full-resource-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-full-resource-20261008
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact reviewed source before applying
        env:
          REVIEW_DIR: ${{ runner.temp }}/full-resource-review
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'poker-full-resource-20261008'
          mkdir -p "$REVIEW_DIR/payload"
          python - <<'PY'
          import base64, hashlib, os, shutil, subprocess, zlib
          from pathlib import Path
          out = Path(os.environ['REVIEW_DIR'])
          parts = []
          for i in range(1, 7):
              p = Path(f'_scripts/full-resource-part-{i}.b64')
              shutil.copyfile(p, out / 'payload' / p.name)
              parts.append(''.join(p.read_text().split()))
          encoded = ''.join(parts)
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(raw).hexdigest()
          expected = '9c71cd9e6973b692f4c8188c981e29f84452a09445e6c89770dc5c7037d71d0a'
          if digest != expected:
              raise SystemExit(f'Source hash mismatch: {digest}')
          patch = out / 'reviewed-source.patch'
          patch.write_bytes(raw)
          print('PASS exact source SHA-256: ' + digest, flush=True)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          for p in Path('_scripts').glob('full-resource-part-*.b64'):
              p.unlink()
          PY
      - name: Build and check content, arithmetic and boundaries
        env:
          REVIEW_DIR: ${{ runner.temp }}/full-resource-review
        run: |
          set -euo pipefail
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$REVIEW_DIR/unit-tests.log"
          node --check assets/poker-finder.js
          node --check assets/poker-study-tools.js
          git diff --exit-code HEAD -- index.html _source/home.html _source/layout.html _source/site.json _source/poker/catalog.json assets/contact.js assets/site.css assets/poker.css assets/hubs.css styles.css _config.yml
      - name: Install browser and accessibility tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/full-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Check search, study lists, calculators and reading
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/full-resource-review
          AXE_PATH: ${{ runner.temp }}/full-qa/node_modules/axe-core/axe.min.js
        run: |
          set -euo pipefail
          python _tests/finder_browser.py 2>&1 | tee "$SCREENSHOT_DIR/finder-browser.log"
          python _tests/full_resource_browser.py 2>&1 | tee "$SCREENSHOT_DIR/full-resource-browser.log"
      - name: Commit only verified content on its feature branch
        env:
          REVIEW_DIR: ${{ runner.temp }}/full-resource-review
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-full-resource-20261008'
          git add _source _scripts _tests _reports assets/poker-finder.css assets/poker-finder.js assets/poker-study-tools.css assets/poker-study-tools.js downloads poker sitemap.xml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Complete Poker full-text discovery, study utilities and deeper guides'
          git push origin HEAD:refs/heads/poker-full-resource-20261008
          git archive --format=tar HEAD > "$REVIEW_DIR/reviewed-source.tar"
          git rev-parse HEAD > "$REVIEW_DIR/commit.txt"
      - name: Save diagnostics and review previews
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-resource-review
          path: ${{ runner.temp }}/full-resource-review/
          retention-days: 1
          if-no-files-found: error
