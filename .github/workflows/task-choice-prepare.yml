name: Prepare task decision guide
on:
  push:
    branches: [codex/task-decision-20261012]
    paths: [.github/workflows/task-choice-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/task-decision-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the exact reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_task-choice-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(3))
          assert len(encoded) == 33232
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 78349
          assert hashlib.sha256(raw).hexdigest() == '53dc9e62c66d88fe82e0a614e07f0a53217774a3746920eded11087ad4f05f47'
          Path('/tmp/task-choice.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero /tmp/task-choice.patch
          git apply --unidiff-zero /tmp/task-choice.patch
      - name: Capture original history, build and check
        run: |
          python -m pip install -r requirements-test.txt
          python _tests/capture_choice_baseline.py --ref 4f80aeb5b20678d4a95e965043342a3f992eb8ad
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py --json _reports/search-audit.json
          node --check assets/ai-task-choice.js
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit source and generated files to the isolated branch
        run: |
          rm -rf _task-choice-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Add a transparent AI task decision guide and compatible NK icons'
          git push origin HEAD:refs/heads/codex/task-decision-20261012
          git archive --format=tar --output=/tmp/task-choice-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-choice-candidate
          path: /tmp/task-choice-candidate.tar
          retention-days: 1
