name: Prepare everyday task release
on:
  push:
    branches: [codex/everyday-task-discovery-20261011]
    paths: [.github/workflows/task-release-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/everyday-task-discovery-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply the reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_task-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(3))
          assert len(encoded) == 33424
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 105797
          assert hashlib.sha256(raw).hexdigest() == 'f39cf2df42d61cdb66c7e260a3a66a773dd5af1b83b9bbcc6e14de02b7e33315'
          Path('/tmp/everyday.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero /tmp/everyday.patch
          git apply --unidiff-zero /tmp/everyday.patch
      - name: Build exact worksheets and check the candidate
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit content without changing workflows
        run: |
          rm -rf _task-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Expose everyday AI tasks and exact private-use worksheets'
          git push origin HEAD:refs/heads/codex/everyday-task-discovery-20261011
          git archive --format=tar --output=/tmp/everyday-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: everyday-candidate
          path: /tmp/everyday-candidate.tar
          retention-days: 1
