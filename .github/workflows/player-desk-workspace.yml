name: Player desk workspace
on:
  push:
    branches: [poker-player-desk-20261008]
permissions:
  contents: write
concurrency:
  group: poker-player-desk-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/poker-player-desk-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_DIR: ${{ runner.temp }}/player-desk-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-player-desk-20261008
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source identity before applying the patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'poker-player-desk-20261008'
          mkdir -p "$REVIEW_DIR/payload"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os, shutil, subprocess, zlib
          out = Path(os.environ['REVIEW_DIR'])
          parts = []
          for i in range(1, 5):
              source = Path(f'_scripts/desk-part-{i}.b64')
              shutil.copyfile(source, out / 'payload' / source.name)
              encoded = ''.join(source.read_text().split())
              if i == 2:
                  encoded = encoded.replace('Zg//vf/nBFZTQ', 'Zg//vf/nvBFZTQ')
              parts.append(encoded)
          encoded = ''.join(parts)
          (out / 'payload' / 'combined.b64').write_text(encoded)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = 'dadb45f7486881d369a56c2af3bcb4dee3228a91584108b25813a95e83413fa9'
          if digest != expected:
              raise SystemExit(f'Patch SHA-256 mismatch: {digest}')
          target = out / 'player-desk.patch'
          target.write_bytes(patch)
          print(f'PASS exact source identity: {digest}', flush=True)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          for source in Path('_scripts').glob('desk-part-*.b64'):
              source.unlink()
          PY
      - name: Build and run all source regressions
        run: |
          set -euo pipefail
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/poker-finder.js
          git diff --exit-code HEAD -- index.html _source/home.html _source/layout.html _source/site.json _source/poker/catalog.json assets/contact.js styles.css assets/site.css _config.yml privacy/index.html
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Verify finder and reference pages
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/player-desk-review
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
        run: |
          set -euo pipefail
          python _tests/finder_browser.py 2>&1 | tee "$REVIEW_DIR/finder-browser.log"
      - name: Commit verified content to the feature branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-player-desk-20261008'
          git add _source _scripts _tests _reports assets/poker-finder.js assets/poker-finder.css downloads poker sitemap.xml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add unified Poker answer finder and practical player references'
          git push origin HEAD:refs/heads/poker-player-desk-20261008
          git archive --format=tar HEAD > "$REVIEW_DIR/player-desk-reviewed.tar"
          git rev-parse HEAD > "$REVIEW_DIR/commit.txt"
      - name: Save diagnostics and review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: player-desk-review
          path: ${{ runner.temp }}/player-desk-review/
          retention-days: 1
          if-no-files-found: error
