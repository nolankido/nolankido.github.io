name: Prepare and verify site update
on:
  push:
    branches: [site-content-completion-20261005]
permissions:
  contents: write
concurrency:
  group: prepare-site-content
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate and check public pages
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run browser regressions without real submissions
        run: python _tests/browser.py
      - name: Commit only verified generated output to staging branch
        run: |
          test "$GITHUB_REF_NAME" = "site-content-completion-20261005"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html about/index.html bio/index.html card/index.html contact/index.html privacy/index.html 404.html notes feed.xml sitemap.xml nolan-kido.vcf
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified public pages from shared source'
            git push origin HEAD:refs/heads/site-content-completion-20261005
          fi
          echo "Verified commit: $(git rev-parse HEAD)"
          echo "Verified tree: $(git rev-parse HEAD^{tree})"
