name: Example source snapshot
on:
  push:
    branches: [codex/practical-ai-example-20261011]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public source
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/site-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: example-source-snapshot
          path: ${{ runner.temp }}/site-source.tar
          retention-days: 1
          if-no-files-found: error
