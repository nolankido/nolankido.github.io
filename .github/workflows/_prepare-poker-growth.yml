name: Prepare poker publishing release
on:
  push:
    branches: [site/poker-publishing-20261005]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed public source and generate pages
        run: |
          mkdir -p "$RUNNER_TEMP/poker-growth-evidence"
          python _scripts/_prepare_poker_growth.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/poker-growth-evidence/unit.log"
          node --check assets/contact.js
      - name: Install browser and accessibility tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Browser layouts and real download paths
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/poker-growth-evidence/screenshots
        run: |
          python _tests/browser.py 2>&1 | tee "$RUNNER_TEMP/poker-growth-evidence/browser.log"
          python _tests/design_browser.py 2>&1 | tee "$RUNNER_TEMP/poker-growth-evidence/design.log"
      - name: Accessibility and populated episode publishing paths
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          REVIEW_OUTPUT: ${{ runner.temp }}/poker-growth-evidence/accessibility.json
        run: |
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/poker-growth-evidence/review.log"
          python _tests/poker_browser.py 2>&1 | tee "$RUNNER_TEMP/poker-growth-evidence/populated.log"
      - name: Package tested public website
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'poker-growth-evidence' / 'website.zip'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  relative = p.relative_to(root)
                  if p.is_file() and '.git' not in relative.parts and '__pycache__' not in relative.parts:
                      z.write(p, relative.as_posix())
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-growth-review
          path: ${{ runner.temp }}/poker-growth-evidence
          retention-days: 7
      - name: Commit only tested release to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build useful poker reader resources and approved-content publishing workflow'
          git push origin HEAD:site/poker-publishing-20261005
