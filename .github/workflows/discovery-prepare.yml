name: Prepare practical discovery release
on:
  push:
    branches: [codex/practical-discovery-20261011]
    paths: [.github/workflows/discovery-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/practical-discovery-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_discovery-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(3))
          assert len(encoded) == 26304
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 72521
          assert hashlib.sha256(raw).hexdigest() == '757cb267a273c1894906bfd50c95ad78ce8546c67a4f097da1fccd5570eaf024'
          Path('/tmp/discovery.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero /tmp/discovery.patch
          git apply --unidiff-zero /tmp/discovery.patch
      - name: Capture real tool previews with fictional inputs
        run: |
          python -m pip install -r requirements-test.txt Pillow==12.3.0
          python -m playwright install --with-deps chromium
          python _scripts/capture_work_previews.py --baseline eaf08e16bad12601934f1d704df4403b2d6c6027
      - name: Build and validate the candidate
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit content to the isolated feature branch
        run: |
          rm -rf _discovery-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Show real practical work and complete Technology writing discovery'
          git push origin HEAD:refs/heads/codex/practical-discovery-20261011
          git archive --format=tar --output=/tmp/discovery-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-candidate
          path: /tmp/discovery-candidate.tar
          retention-days: 1
