name: Player desk final layout
on:
  push:
    branches: [poker-player-desk-20261008]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/poker-player-desk-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-player-desk-20261008
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply compact finder layout and its regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_source/poker/find.html')
          s=p.read_text()
          changes=[
           ('What are you trying to understand?', 'Start with a question.'),
           ('Search explanations on this site, outside resources and glossary definitions together. You do not need to know which library contains the answer.', 'Search guides, outside sources and poker definitions in one place.'),
           ('<p>${poker_finder_scope}</p>', ''),
           ('<p class="small-copy">Search ranks text matches,', '<details class="poker-details finder-scope"><summary>What this search covers</summary><div><p>${poker_finder_scope}</p><p class="small-copy">Search ranks text matches,'),
           ('privacy notice</a>.</p><p><a href="/poker/resource-collections/">', 'privacy notice</a>.</p></div></details><p><a href="/poker/resource-collections/">')]
          for old,new in changes:
              assert s.count(old)==1,old
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('assets/poker-finder.css')
          p.write_text(p.read_text()+'''
          /* Put the search task before the reference catalogue on small screens. */
          .page-poker-find .page-hero { padding-top:24px; padding-bottom:24px; }
          .page-poker-find .page-title { font-size:clamp(2rem,4vw,3.25rem); line-height:1.15; }
          .page-poker-find .folio-row { padding-top:28px; padding-bottom:28px; }
          .page-poker-find .section-deck { margin-bottom:16px; }
          #finder-controls { margin-top:20px; }
          .finder-scope { margin:20px 0; }
          @media(max-width:760px) { .page-poker-find .section-meta { margin-bottom:14px; } }
          ''')
          p=Path('_tests/finder_browser.py')
          s=p.read_text()
          old="if slug=='find':expect(page.locator('[data-finder-card]:visible')).to_have_count(12)"
          assert s.count(old)==1
          new="if slug=='find':\n                        expect(page.locator('[data-finder-card]:visible')).to_have_count(12)\n                        assert page.locator('#finder-search').bounding_box()['y'] < 900,('Search below first viewport',width)"
          p.write_text(s.replace(old,new))
          PY
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          git diff --exit-code HEAD -- index.html _source/home.html _source/layout.html _source/site.json _source/poker/catalog.json assets/contact.js styles.css assets/site.css _config.yml privacy/index.html
      - name: Install browser requirements
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Check the complete finder experience
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/player-desk-final
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
        run: |
          set -euo pipefail
          mkdir -p "$SCREENSHOT_DIR"
          python _tests/finder_browser.py 2>&1 | tee "$SCREENSHOT_DIR/finder-browser.log"
      - name: Commit the verified layout only on its feature branch
        env:
          REVIEW_DIR: ${{ runner.temp }}/player-desk-final
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-player-desk-20261008'
          git add _source _tests assets/poker-finder.css poker downloads sitemap.xml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bring Poker search into the first mobile viewport'
          git push origin HEAD:refs/heads/poker-player-desk-20261008
          git archive --format=tar HEAD > "$REVIEW_DIR/player-desk-final.tar"
          git rev-parse HEAD > "$REVIEW_DIR/commit.txt"
      - name: Save final layout previews
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: player-desk-final
          path: ${{ runner.temp }}/player-desk-final/
          retention-days: 1
          if-no-files-found: warn
