name: Author hand-ranking best-five recaps
on:
  push:
    branches: [website-growth-hand-ranking-best-five-20261025]
permissions:
  contents: write
jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: website-growth-hand-ranking-best-five-20261025
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply the bounded source and test change
        run: python _automation/apply_best_five.py
      - name: Regenerate and verify focused scope
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p 'test_viewer_guides.py' -v
          git diff --check
      - name: Commit generated output without temporary authoring files
        run: |
          rm -f .github/workflows/author-best-five.yml _automation/apply_best_five.py
          rmdir _automation 2>/dev/null || true
          git config user.name 'nolankido'
          git config user.email 'kidon@hawaii.edu'
          git add -A
          git commit -m 'Show exact best-five cards in hand-ranking answers'
          git push origin HEAD:website-growth-hand-ranking-best-five-20261025
