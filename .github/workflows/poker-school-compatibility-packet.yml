name: Stage exact Poker School compatibility tree
on:
  push:
    branches: [audit/poker-school-compatibility-20261017]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f4db4841d970e885b845289abc4edd3761de1bb
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify transport and apply only the pinned source changes
        env:
          PACKET_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          pieces = [subprocess.check_output(['git', 'show', os.environ['PACKET_COMMIT'] + ':_patches/poker-school-source.part' + str(i)]) for i in (1, 2, 3)]
          expected = ['d4c45a42ff05f3fab75bfdc892da82f86ce235d0', '06ce80d8ec0964d55e1c7536384110623b265cc1', '2e075a5379e893d4674f0b8ac61aaea82a13061c']
          for raw, digest in zip(pieces, expected):
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == digest
          encoded = b''.join(pieces)
          # Correct one known transport transcription byte, then require the complete source patch hash.
          assert encoded.count(b'B7Oh9Np6') == 1
          encoded = encoded.replace(b'B7Oh9Np6', b'B7Oh9NZ6')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'de49e04cf8ca3ff719412f8f34ee12af252a09b42e3dce347745aa4c45cb6521'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'school-source.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - name: Reproduce deterministic reports and committed HTML
        run: |
          python _scripts/build.py
          python _scripts/check_search.py --json _reports/search-audit.json
          python _reports/poker-school/capture_history.py --write
          python _reports/poker-search-intent/evaluate.py --write
          python _scripts/build.py --check
          python _reports/poker-school/capture_history.py
          node --check assets/poker-school-interest.js
          git add -A
          actual=$(git write-tree)
          test "$actual" = eeb998a904b52629cbd102686051937db870ba2c
          python _scripts/poker_school_release.py
          echo "VERIFIED_TREE=$actual"
      - name: Stage only to the isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage exactly reproduced Poker School compatibility candidate'
          git push origin HEAD:refs/heads/audit/poker-school-ready-20261017
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
          echo "STAGED_TREE=$(git rev-parse HEAD^{tree})"
