name: Poker School accessibility dependency
on:
  push:
    branches: [audit/poker-school-compatibility-20261017]
permissions:
  contents: read
jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the same pinned checker used by Site checks
        run: |
          mkdir -p "$RUNNER_TEMP/qa-dependency"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/qa-dependency" axe-core@4.10.3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-school-axe
          path: ${{ runner.temp }}/qa-dependency/
          retention-days: 1
          if-no-files-found: error
