name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and HTML checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install HTML test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check committed build and HTML before browsers
        run: |
          python _scripts/build.py --check
          python _tests/check_html5.py
          python downloads/website-check-reproduction.py
          node --check assets/workflow-time.js
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/public-profile.js
          node --check assets/page-sharing.js
          node --check assets/ai-task-choice.js
          node --check assets/task-brief.js
          node --check assets/site-find.js
          node --check assets/contact.js
          node --check assets/poker-library.js
          node --check assets/poker-finder.js
          node --check assets/poker-study-tools.js
  browser:
    name: Browser / ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - group: identity
            suites: search_visibility_browser first_steps_browser task_brief_browser workflow_evidence_browser practical_discovery_browser everyday_tasks_browser public_profile_browser summary_review_browser reading_delivery_browser ai_task_choice_browser answer_review_browser search_entrypoints_browser local_fonts_browser
          - group: navigation
            suites: browser design_browser
          - group: reader-tools
            suites: site_find_browser search_sections_browser reading_return_browser entrypoints_browser living_well_browser author_archive_browser practical_path_browser practical_navigation_browser
          - group: accessibility
            suites: overview_browser cash_selection_browser review_browser
          - group: poker
            suites: poker_browser workshops_browser library_browser labs_browser field_guide_browser collections_browser finder_browser topics_browser full_resource_browser beginner_browser preflop_browser flop_browser river_browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser and accessibility test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Run every suite and preserve all failures
        env:
          SUITES: ${{ matrix.suites }}
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/browser-previews
        run: |
          set -o pipefail
          mkdir -p "$SCREENSHOT_DIR"
          status=0
          for suite in $SUITES; do
            echo "Running $suite"
            if ! python -u "_tests/$suite.py" 2>&1 | tee "$SCREENSHOT_DIR/$suite.log"; then
              status=1
            fi
          done
          exit "$status"
      - name: Save browser previews and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.group }}
          path: ${{ runner.temp }}/browser-previews/
          retention-days: 1
          if-no-files-found: error
  checks:
    name: checks
    needs: [build, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release check to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
  published:
    name: Published release bytes
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify published main release independently of browser-test duration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit will receive its own live check.'
            exit 0
          fi
          python _scripts/check_live.py --attempts 10 --interval 10
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Main advanced during verification; the newer run owns current-release verification.'
            exit 0
          fi
          echo "LIVE_VERIFIED_COMMIT=$GITHUB_SHA"
