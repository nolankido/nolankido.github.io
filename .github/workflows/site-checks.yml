name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check committed build and links
        run: |
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
          node --check assets/poker-library.js
          node --check assets/poker-finder.js
          node --check assets/poker-study-tools.js
      - name: Install browser and accessibility test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Offline browser regressions
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/poker-reading-previews
        run: |
          python _tests/browser.py
          python _tests/design_browser.py
      - name: Whole-site accessibility and failure recovery
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/poker-reading-previews
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/poker-reading-previews"
          for suite in review_browser poker_browser workshops_browser library_browser labs_browser field_guide_browser collections_browser finder_browser full_resource_browser; do
            echo "Running $suite"
            python "_tests/$suite.py" 2>&1 | tee "$RUNNER_TEMP/poker-reading-previews/$suite.log"
          done
      - name: Save Poker reading-path previews and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-reading-previews
          path: |
            ${{ runner.temp }}/poker-reading-previews/poker-*.png
            ${{ runner.temp }}/poker-reading-previews/*.log
          retention-days: 1
          if-no-files-found: error
      - name: Verify published main release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit will receive its own live check.'
            exit 0
          fi
          python _scripts/check_live.py --attempts 10 --interval 10
          echo "LIVE_VERIFIED_COMMIT=$GITHUB_SHA"
