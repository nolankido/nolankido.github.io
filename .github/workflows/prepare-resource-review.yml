name: Prepare bounded resource maintenance
on:
  push:
    branches: [maintenance-prepare-resource-review-20261023]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve reviewed inputs outside checkout
        run: |
          cp _maintenance/prepare-resource-review.py "$RUNNER_TEMP/prepare-resource-review.py"
          cp _maintenance/resource-review-payload.zlib "$RUNNER_TEMP/resource-review-payload.zlib"
          cp _maintenance/fix-resource-search-history.py "$RUNNER_TEMP/fix-resource-search-history.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9c77098763f7f7e43d80a8e6994283484593b78e
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce pinned candidate and store immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PAYLOAD: ${{ runner.temp }}/resource-review-payload.zlib
          CORRECTION_SCRIPT: ${{ runner.temp }}/fix-resource-search-history.py
          RECEIPT_DIR: ${{ runner.temp }}/prepared-resource-review
        run: python "$RUNNER_TEMP/prepare-resource-review.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-resource-review-tree
          path: ${{ runner.temp }}/prepared-resource-review/
          retention-days: 1
          if-no-files-found: error
