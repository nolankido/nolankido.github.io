name: Prepare and verify editorial design
on:
  push:
    branches: [editorial-design-20261005]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/editorial-design-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply source migration and generate pages
        run: |
          python _scripts/apply_editorial.py
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Contact and fallback-layout regressions
        run: |
          python _tests/browser.py
          python _tests/design_browser.py
      - name: Verify layout with the actual design fonts
        env:
          ALLOW_WEB_FONTS: '1'
        run: python _tests/design_browser.py
      - name: Commit verified source and generated pages to staging only
        run: |
          test "$GITHUB_REF_NAME" = 'editorial-design-20261005'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _scripts/build.py _source/pages.json _source/privacy.html _config.yml README.md .github/workflows/site-checks.yml index.html about bio card contact privacy 404.html notes resources feed.xml sitemap.xml nolan-kido.vcf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate and verify editorial site and resource pages'
            git push origin HEAD:refs/heads/editorial-design-20261005
          fi
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
          echo "VERIFIED_TREE=$(git rev-parse HEAD^{tree})"
