name: Poker content workspace
on:
  push:
    branches: [poker-field-guide-20261008]
permissions:
  contents: write
concurrency:
  group: poker-field-guide-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/poker-field-guide-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-field-guide-20261008
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate reviewed content and run source checks
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'poker-field-guide-20261008'
          if test -f _scripts/prepare_field_guide.py; then
            python _scripts/prepare_field_guide.py
            rm _scripts/prepare_field_guide.py
          fi
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          git diff --exit-code HEAD -- index.html _source/home.html _source/layout.html _source/site.json _source/poker/catalog.json _source/poker/resources.json assets/contact.js assets/site.css styles.css _config.yml .github/workflows/site-checks.yml
      - name: Install browser test requirements
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Verify new reader paths, mobile and print
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/field-guide-review
        run: |
          set -euo pipefail
          mkdir -p "$SCREENSHOT_DIR"
          python _tests/field_guide_browser.py 2>&1 | tee "$SCREENSHOT_DIR/field-guide-browser.log"
      - name: Commit verified source and generated HTML to feature branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-field-guide-20261008'
          git add _source _scripts _tests _reports assets/poker-fieldguide.css downloads poker sitemap.xml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish practical tournament field guide and study pathways'
            git push origin HEAD:refs/heads/poker-field-guide-20261008
          fi
          git archive --format=tar HEAD > "$RUNNER_TEMP/field-guide-review/poker-field-reviewed.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/field-guide-review/commit.txt"
      - name: Save review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-field-reviewed
          path: ${{ runner.temp }}/field-guide-review/
          retention-days: 1
          if-no-files-found: warn
