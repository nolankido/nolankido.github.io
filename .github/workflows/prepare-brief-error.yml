name: Prepare bounded brief-error candidate
on:
  push:
    branches: [maintenance-prepare-brief-error-20261021]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve explicit candidate inputs outside the checkout
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/brief-inputs/_tests" "$RUNNER_TEMP/brief-inputs/_reports/website-growth"
          cp _tests/task_brief_error_history.py _tests/task-brief-error-change.json _tests/test_task_brief_error_state.py "$RUNNER_TEMP/brief-inputs/_tests/"
          cp _reports/website-growth/turn-15-task-brief-error-state.md "$RUNNER_TEMP/brief-inputs/_reports/website-growth/"
          cp _reports/website-growth/prepare-brief-error.py "$RUNNER_TEMP/prepare-brief-error.py"
          git checkout --detach 82c0a82df9969c2255e3c3ebbaacf290faeef78e
          test "$(git rev-parse HEAD)" = 82c0a82df9969c2255e3c3ebbaacf290faeef78e
      - name: Reproduce the exact reviewed candidate
        run: |
          python "$RUNNER_TEMP/prepare-brief-error.py"
          python -m pip install -r requirements-test.txt
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          node --check assets/task-brief.js
          python -m unittest discover -s _tests -p 'test_task_brief_error_state.py' -v
          python -m unittest discover -s _tests -p 'test_feedback_context.py' -v
          python -m unittest discover -s _tests -p 'test_task_brief_growth.py' -v
      - name: Store verified Git objects without changing any repository reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/prepare-brief-error.py" --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-brief-error-tree
          path: ${{ runner.temp }}/prepared-brief-error.json
          retention-days: 1
          if-no-files-found: error
