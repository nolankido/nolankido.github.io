name: Temporary homepage font reflow verification
on:
  push:
    branches: [improve-homepage-growth-turn02-20261017]
    paths: [.github/workflows/homepage-turn02-font-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm exact source scope and apply the plain-text patch
        run: |
          python - <<'PY'
          import subprocess
          expected={'.github/workflows/homepage-turn02-font-fix.yml','_reports/website-growth/turn02-font-reflow.patch'}
          actual=set(subprocess.check_output(['git','diff','--name-only','8f31546847c9c9396c3439eeb7af3c8960b86398','HEAD'],text=True).splitlines())
          if actual!=expected: raise SystemExit('Unexpected delta: '+repr(actual))
          PY
          git apply --check --whitespace=error-all _reports/website-growth/turn02-font-reflow.patch
          git apply --whitespace=error-all _reports/website-growth/turn02-font-reflow.patch
      - name: Verify generated outputs, history and actual fonts
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python _scripts/build.py --check
          python _reports/website-growth/capture_turn02.py
          python -m unittest discover -s _tests -p 'test_homepage_growth.py' -v
          python _tests/browser.py BrowserTests.test_homepage_without_scripts_and_with_enlarged_text
      - name: Remove temporary files and commit only the checked candidate
        run: |
          git rm -- .github/workflows/homepage-turn02-font-fix.yml _reports/website-growth/turn02-font-reflow.patch
          git add -A
          git diff --cached --check
          actual=$(git write-tree)
          test "$actual" = 5f83e00e3b5c8fe17a35e4190510b52ea7780498 || { echo "Unexpected tree: $actual"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep enlarged homepage text within tablet columns with actual-font regression'
          git push origin HEAD:improve-homepage-growth-turn02-20261017
