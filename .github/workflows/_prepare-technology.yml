name: Prepare technology-first release
on:
  push:
    branches: [site/technology-first-20261005]
    paths: ['_scripts/_gateway.patch.b64', '.github/workflows/_prepare-technology.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed source patch and build
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib, subprocess
          patch = zlib.decompress(base64.b64decode(Path('_scripts/_gateway.patch.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '0d25ef82bb6032da4878c0fd3c694599eb36975462596764b1dcd9d8ba1c9c8e'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
      - name: Install browser and accessibility tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Browser, hierarchy, and download checks
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/gateway-evidence/screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-evidence"
          python _tests/browser.py
          python _tests/design_browser.py
      - name: Accessibility and reflow audit
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          REVIEW_OUTPUT: ${{ runner.temp }}/gateway-evidence/accessibility.json
        run: python _tests/review_browser.py
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technology-first-review
          path: ${{ runner.temp }}/gateway-evidence
          retention-days: 7
      - name: Commit only the tested tree to staging
        run: |
          rm _scripts/_gateway.patch.b64 .github/workflows/_prepare-technology.yml
          git add -A
          test "$(git write-tree)" = '6056312fc08ee6ce131523f24d138e7d0b001fcf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make Technology the lead destination, followed by Poker and Creative Work'
          git push origin HEAD:site/technology-first-20261005
