name: Living Well library preview
on:
  push:
    branches: [living-well-resource-library-20261009]
permissions:
  contents: read
concurrency:
  group: living-well-resource-library
  cancel-in-progress: false
jobs:
  library:
    if: github.ref == 'refs/heads/living-well-resource-library-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed source with before and after integrity checks
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          allowed = {
              '_scripts/check_living_well_links.py', '_scripts/living_well.py', '_scripts/living_well_resources.py',
              '_source/about.html', '_source/creative/home.html', '_source/living-well/RESOURCE_LIBRARY_RELEASE.md',
              '_source/living-well/resources.json', '_source/pages.json', '_source/site.json', '_source/technology/home.html',
              '_tests/living_well_browser.py', '_tests/test_content.py', '_tests/test_gateway.py',
              '_tests/test_living_well.py', '_tests/test_living_well_expansion.py', '_tests/test_living_well_library.py',
              '_tests/test_living_well_resources.py', '_tests/test_poker_content.py', '_tests/test_viewer_next.py',
              'assets/living-well.css',
          }
          encoded = ''.join(Path(f'_scripts/lw-library-transfer-{i}.txt').read_text().strip() for i in (1, 2, 3))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '4e7a074794befe0d8652d0e4a43d93a25df6d36b5d6d1600471a0d63c7b50853', 'Source payload digest mismatch'
          payload = json.loads(raw)
          assert payload['version'] == 1
          assert payload['base_commit'] == 'e1ba2f1245afd4a06f3f625a46042d90e957f464'
          assert set(payload['files']) == allowed
          subprocess.run(['git', 'merge-base', '--is-ancestor', payload['base_commit'], 'HEAD'], check=True)
          for name, hashes in payload['files'].items():
              path = Path(name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual == hashes['before'], 'Changed source baseline: ' + name
          patch = Path(os.environ['RUNNER_TEMP']) / 'living-well-library-reviewed.patch'
          patch.write_text(payload['patch'], encoding='utf-8')
          changes = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          assert {line.split('\t', 2)[2] for line in changes.splitlines()} == allowed
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          for name, hashes in payload['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == hashes['after'], name
          print('Applied twenty reviewed source files with exact baseline and result hashes.')
          PY
      - name: Build and run the full automated suite
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/living-well-library-checks"
          python _scripts/build.py
          python _scripts/build.py --check 2>&1 | tee "$RUNNER_TEMP/living-well-library-checks/build.log"
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/living-well-library-checks/unit.log"
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Check public resource destinations without modifying the catalog
        run: |
          python _scripts/check_living_well_links.py --output "$RUNNER_TEMP/living-well-library-checks/external-links.json" --workers 6 --report-only
      - name: Verify reading routes and whole-site accessibility
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/living-well-library-checks
        run: |
          set -o pipefail
          python _tests/living_well_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-library-checks/browser.log"
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-library-checks/review.log"
      - name: Commit verified source and output to this review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'living-well-resource-library-20261009'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          python - <<'PY'
          import subprocess
          allowed = {
              '_scripts/check_living_well_links.py', '_scripts/living_well.py', '_scripts/living_well_resources.py',
              '_source/about.html', '_source/creative/home.html', '_source/living-well/RESOURCE_LIBRARY_RELEASE.md',
              '_source/living-well/resources.json', '_source/pages.json', '_source/site.json', '_source/technology/home.html',
              '_tests/living_well_browser.py', '_tests/test_content.py', '_tests/test_gateway.py',
              '_tests/test_living_well.py', '_tests/test_living_well_expansion.py', '_tests/test_living_well_library.py',
              '_tests/test_living_well_resources.py', '_tests/test_poker_content.py', '_tests/test_viewer_next.py',
              'assets/living-well.css', 'sitemap.xml', 'index.html', 'about/index.html', 'bio/index.html',
              'card/index.html', 'technology/index.html', 'creative/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          unexpected = {p for p in changed if p not in allowed and not p.startswith('living-well/')}
          assert not unexpected, sorted(unexpected)
          print('Verified source/output scope:', len(changed), 'files; protected site assets are unchanged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish verified Living Well resource collections and clear public introductions'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/living-well-library-checks/verified-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: living-well-library-checks
          path: |
            ${{ runner.temp }}/living-well-library-checks/*.log
            ${{ runner.temp }}/living-well-library-checks/*.json
            ${{ runner.temp }}/living-well-library-checks/*.txt
            ${{ runner.temp }}/living-well-library-checks/living-well-*.png
          retention-days: 1
          if-no-files-found: warn
