name: Prepare evidence release
on:
  push:
    branches: [codex/workflow-evidence-20261011]
    paths: [.github/workflows/evidence-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/workflow-evidence-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_evidence-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(4))
          assert len(encoded) == 38064
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 96984
          assert hashlib.sha256(raw).hexdigest() == '79300cbbb66e90370596582d54875754991666a7b2e52ff5dcca5edc10ebf371'
          Path('/tmp/evidence.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero /tmp/evidence.patch
          git apply --unidiff-zero /tmp/evidence.patch
      - name: Build and check the new reader destinations
        run: |
          python -m pip install html5lib==1.1
          python _scripts/build.py
          python _scripts/build.py --check
          python _scripts/check_search.py --json _reports/search-audit.json
          python _tests/check_html5.py
          python downloads/website-check-reproduction.py
          node --check assets/workflow-time.js
          python -m unittest discover -s _tests -p test_workflow_evidence.py -v
      - name: Commit content without changing workflows
        run: |
          rm -rf _evidence-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Add honest AI time comparison and a documented verification case'
          git push origin HEAD:refs/heads/codex/workflow-evidence-20261011
          git archive --format=tar --output=/tmp/evidence-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-candidate
          path: /tmp/evidence-candidate.tar
          retention-days: 1
