name: Living Well recovery source
on:
  push:
    branches: [living-well-real-life-utility-20261009]
permissions:
  contents: read
concurrency:
  group: living-well-utility-completion
  cancel-in-progress: false
jobs:
  completion:
    if: github.ref == 'refs/heads/living-well-real-life-utility-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply only the reviewed source changes
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          allowed = {
              '_scripts/living_well.py', '_scripts/living_well_resources.py', '_scripts/living_well_utility.py',
              '_source/living-well/discovery.json', '_source/living-well/REAL_LIFE_UTILITY_RELEASE.md',
              '_source/living-well/REAL_LIFE_UTILITY_REVIEW.md', '_source/living-well/TECHNOLOGY_FOR_REAL_LIFE_PUBLISHING.md',
              '_tests/living_well_browser.py', '_tests/test_living_well_utility.py',
              '_tests/test_living_well_utility_completion.py', '_tests/test_living_well_resources.py',
          }
          encoded = ''.join(Path(f'_scripts/lw-utility-completion-{i}.txt').read_text().strip() for i in (1, 2))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '66114c26c37e81fd0f8edb23e43df6a32fedc59b03a094e3ec4508d7f5c9f075', 'Payload integrity failure'
          data = json.loads(raw)
          assert data['version'] == 1
          assert data['base_commit'] == '9177d722dd54bfef3d4789c75027c8e3ec80c67c'
          assert set(data['files']) == allowed
          subprocess.run(['git', 'merge-base', '--is-ancestor', data['base_commit'], 'HEAD'], check=True)
          for name, hashes in data['files'].items():
              p = Path(name)
              actual = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual == hashes['before'], 'Unexpected source baseline: ' + name
          patch = Path(os.environ['RUNNER_TEMP']) / 'living-well-completion.patch'
          patch.write_text(data['patch'], encoding='utf-8')
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          assert {line.split('\t', 2)[2] for line in stats.splitlines()} == allowed
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          for name, hashes in data['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == hashes['after'], name
          print('Eleven source files verified before and after application.')
          p = Path('_tests/living_well_browser.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '751896d7cefd22073121337d702817e518ad52fb3cdee61aa70858595e9d4a6d'
          text = p.read_text()
          start = text.index("            plain.locator('#libby .lw-directory-detail a').click()")
          end = text.index("            for shelf in lw.resources.load(ROOT)['shelves']:", start)
          replacement = '''            # Wait for the destination document, not just the changed address.
                      # Native focus brings the disclosure into view without altering its state.
                      # A real pointer click, with ordinary actionability checks, still opens it.
                      navigation_events = []
                      def record_navigation(frame):
                          if frame == plain.main_frame:
                              navigation_events.append(frame.url)
                      plain.on('framenavigated', record_navigation)
                      try:
                          for attempt in range(3):
                              if attempt:
                                  plain.goto(base + '/living-well/free-resources/#libby')
                              plain.locator('#libby .lw-directory-detail a').click()
                              plain.wait_for_url(base + '/living-well/free-resources/world/#libby', wait_until='load')
                              expect(plain.locator('h1')).to_have_text(next(s['title'] for s in lw.resources.load(ROOT)['shelves'] if s['id'] == 'world'))
                              disclosure = plain.locator('#libby summary')
                              expect(disclosure).to_have_count(1)
                              disclosure.focus()
                              expect(disclosure).to_be_focused()
                              expect(disclosure).to_be_in_viewport()
                              disclosure.click()
                              expect(plain.locator('#libby .lw-resource-notes')).to_have_attribute('open', '')
                          (out / 'living-well-nojs-navigation.json').write_text(json.dumps({'attempts': 3, 'status': 'passed', 'events': navigation_events}, indent=2) + '\\n')
                      except Exception:
                          (out / 'living-well-nojs-navigation.json').write_text(json.dumps({'status': 'failed', 'url': plain.url, 'events': navigation_events, 'summary_count': plain.locator('#libby summary').count()}, indent=2) + '\\n')
                          plain.screenshot(path=str(out / 'living-well-nojs-navigation-failure.png'), full_page=True)
                          raise
                      finally:
                          plain.remove_listener('framenavigated', record_navigation)
          '''
          lines = replacement.splitlines()
          replacement = lines[0] + '\n' + '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          p.write_text(text[:start] + replacement + text[end:])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '4b7c805b56cdcb2859f81bcff0f0cc5bc5e6ac3ff96d713348932f1dddab4380', 'Navigation follow-up differs from local review'
          PY
      - name: Build and run every unit regression
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/living-well-completion"
          python _scripts/build.py
          python _scripts/build.py --check 2>&1 | tee "$RUNNER_TEMP/living-well-completion/build.log"
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/living-well-completion/unit.log"
      - name: Install browser and accessibility tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Test practical guides and retained whole-site review
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/living-well-completion
        run: |
          set -o pipefail
          python _tests/living_well_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-completion/browser.log"
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-completion/review.log"
      - name: Commit verified source and generated files to this review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'living-well-real-life-utility-20261009'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          python - <<'PY'
          import subprocess
          allowed = {
              '_scripts/living_well.py', '_scripts/living_well_resources.py', '_scripts/living_well_utility.py',
              '_source/living-well/discovery.json', '_source/living-well/REAL_LIFE_UTILITY_RELEASE.md',
              '_source/living-well/REAL_LIFE_UTILITY_REVIEW.md', '_source/living-well/TECHNOLOGY_FOR_REAL_LIFE_PUBLISHING.md',
              '_tests/living_well_browser.py', '_tests/test_living_well_utility.py',
              '_tests/test_living_well_utility_completion.py', '_tests/test_living_well_resources.py', 'sitemap.xml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          unexpected = {p for p in changed if p not in allowed and not p.startswith('living-well/')}
          assert not unexpected, sorted(unexpected)
          print('Verified change scope:', len(changed), 'files. Global site and other sections unchanged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: complete Technology for Real Life with seven usable starters and reading paths'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/living-well-completion/verified-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: living-well-completion-checks
          path: |
            ${{ runner.temp }}/living-well-completion/*.log
            ${{ runner.temp }}/living-well-completion/*.json
            ${{ runner.temp }}/living-well-completion/*.txt
            ${{ runner.temp }}/living-well-completion/living-well-*.png
          retention-days: 1
          if-no-files-found: warn
