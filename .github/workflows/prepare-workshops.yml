name: Prepare Poker workshops
on:
  push:
    branches: [poker-workshops-20261006]
    paths: ['.github/workflows/prepare-workshops.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-workshops-20261006
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Integrate narrowly scoped sources and rebuild
        run: |
          python _scripts/prepare_workshops.py
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('_source/poker/hand-to-vlog.html')
          content=path.read_text()
          target='A proposed editing workflow, not an account of a published episode.'
          assert content.count(target)==1
          path.write_text(content.replace(target,'After-play creator work. A proposed editing workflow, not an account of a published episode.'))
          path=Path('_source/pages.json')
          pages=json.loads(path.read_text())
          titles={'poker-pot-odds-workshop':'Pot odds, with the assumptions visible.', 'poker-range-combinations':'From possible hands to weighted ranges.', 'poker-hand-to-vlog':'From hand notes to a poker vlog.'}
          for page in pages:
              if page['id'] in titles: page['title']=titles[page['id']]
          path.write_text(json.dumps(pages,ensure_ascii=False,indent=2)+'\n')
          path=Path('_tests/test_workshops.py')
          content=path.read_text()
          target='self.assertIn(phrase, source)'
          assert content.count(target)==1
          path.write_text(content.replace(target,'self.assertIn(phrase.lower(), source.lower())'))
          PY
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
          git diff --check
      - name: Verify protected content and commit generated files
        run: |
          test "$GITHUB_REF_NAME" = 'poker-workshops-20261006'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0,'_tests')
          from test_workshops import Words, SLUGS
          base='8d7747578848b940164c316febfefa440b906eb7'
          names=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          allowed={'_source/poker/home.html','_source/poker/study.html','_source/poker/start-here.html'}
          protected=[]
          for name in names:
              if name.startswith('assets/') or name in ['styles.css','_source/layout.html','_source/site.json','feed.xml','ANALYTICS.md']:
                  protected.append(name)
              elif name.startswith('_source/poker/') and name not in allowed:
                  protected.append(name)
              elif name.endswith('.html') and not name.startswith(('poker/','_source/poker/')):
                  protected.append(name)
          for name in protected:
              expected=subprocess.check_output(['git','show',base+':'+name])
              assert Path(name).read_bytes()==expected, name
          print('PASS: exact-byte preservation for',len(protected),'existing assets and non-target files')
          counts={slug:len(Words(Path('_source/poker',slug+'.html').read_text()).text().split()) for slug in SLUGS}
          print('WORKSHOP_WORD_COUNTS='+str(counts))
          print('TOTAL_WORKSHOP_WORDS='+str(sum(counts.values())))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _source _scripts/check_live.py _tests/test_workshops.py README.md poker sitemap.xml
          git diff --cached --stat
          git commit -m 'Connect Poker workshops, study routes, worksheets and generated public pages'
          git push origin HEAD:refs/heads/poker-workshops-20261006
