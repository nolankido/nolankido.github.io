name: Prepare reading delivery
on:
  push:
    branches: [codex/reading-delivery-20261012]
    paths: [.github/workflows/reading-delivery-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/reading-delivery-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the exact reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_reading-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(4))
          assert len(encoded) == 49664
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 136724
          assert hashlib.sha256(raw).hexdigest() == 'f8703666527d68a6798f22e184c1f53dbd34adeba4e8a2481e57ebb3dabb3e19'
          Path('/tmp/reading.patch').write_bytes(raw)
          PY
          git apply --check /tmp/reading.patch
          git apply /tmp/reading.patch
      - name: Render sharing cards and verify the content candidate
        run: |
          python -m pip install -r requirements-test.txt Pillow==12.3.0
          python _scripts/render_social_cards.py --only ai-time-savings check-ai-summary checking-ai-website-changes
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          node --check assets/page-sharing.js
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit content without changing workflows
        run: |
          rm -rf _reading-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Improve first-render font delivery and canonical page sharing'
          git push origin HEAD:refs/heads/codex/reading-delivery-20261012
          git archive --format=tar --output=/tmp/reading-delivery-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reading-delivery-candidate
          path: /tmp/reading-delivery-candidate.tar
          retention-days: 1
