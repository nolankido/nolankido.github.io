name: Prepare poker release
on:
  push:
    branches: [site/poker-hub-20261005]
    paths: [_scripts/_prepare_poker.py, .github/workflows/_prepare-poker.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/site/poker-hub-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: site/poker-hub-20261005
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare public source and generated pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/poker-release/screenshots"
          python _scripts/_prepare_poker.py
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/poker-release/unit-tests.log"
          node --check assets/contact.js
      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Browser and download regressions
        shell: bash
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/poker-release/screenshots
        run: |
          set -euo pipefail
          python _tests/browser.py 2>&1 | tee "$RUNNER_TEMP/poker-release/browser-tests.log"
          python _tests/design_browser.py 2>&1 | tee "$RUNNER_TEMP/poker-release/design-tests.log"
      - name: Accessibility and failure recovery
        shell: bash
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          REVIEW_OUTPUT: ${{ runner.temp }}/poker-release/review.json
        run: |
          set -euo pipefail
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/poker-release/review-tests.log"
      - name: Package public source for review
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'poker-release'
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out / 'website.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  rel = p.relative_to(root)
                  if p.is_file() and not any(part in {'.git', '__pycache__', 'node_modules'} for part in rel.parts):
                      z.write(p, rel.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: poker-release-review
          path: ${{ runner.temp }}/poker-release/
          retention-days: 7
      - name: Commit only tested release to staging
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/site/poker-hub-20261005'
          python _scripts/build.py --check
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Create static personal gateway and poker section'
          git push origin HEAD:refs/heads/site/poker-hub-20261005
          echo "PREPARED_COMMIT=$(git rev-parse HEAD)"
