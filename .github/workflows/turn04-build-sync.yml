name: Temporary Turn 04 generated-page sync
on:
  push:
    branches: [grow-site-turn04-public-source-case-20261017]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build deterministic static pages and check focused tests
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_task_brief_growth.py' -v
          python -m unittest discover -s _tests -p 'test_technology_jumps.py' -v
          python -m unittest discover -s _tests -p 'test_turn04_public_source.py' -v
      - name: Commit generated files on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technology/index.html find/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate Turn 04 documented example pages"
            git push origin HEAD:grow-site-turn04-public-source-case-20261017
          fi
