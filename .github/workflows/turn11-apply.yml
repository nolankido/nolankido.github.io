name: Prepare Turn 11 candidate
on:
  push:
    branches: [website-growth-turn11-task-first-20261017]
    paths: [.github/workflows/turn11-apply.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and test candidate against pinned main
        run: python _reports/website-growth/_turn11_apply.py
      - name: Remove temporary runner infrastructure and commit verified build
        run: |
          rm .github/workflows/turn11-apply.yml _reports/website-growth/_turn11_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --check
          git commit -m "Complete Turn 11 task-first navigation with generated pages and pinned regression coverage"
          git push origin HEAD:refs/heads/website-growth-turn11-task-first-20261017
