name: Prepare source-review guide
on:
  push:
    branches: [codex/reader-value-20261012]
    paths: [.github/workflows/reader-value-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/reader-value-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the hash-bound reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = ''.join((Path('_reader-value-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(3))
          assert len(encoded) == 23276
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 60282
          assert hashlib.sha256(raw).hexdigest() == 'b08aa017b2229e7988ff42639ec3e0b5f2d4305356bbdf0ba4cbe0c91db2073e'
          Path('/tmp/source-review.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero /tmp/source-review.patch
          git apply --unidiff-zero /tmp/source-review.patch
      - name: Build and verify the content candidate
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py --json _reports/search-audit.json
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit content without changing workflows
        run: |
          rm -rf _reader-value-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Teach source-to-summary checking through an inspectable worked guide'
          git push origin HEAD:refs/heads/codex/reader-value-20261012
          git archive --format=tar --output=/tmp/source-review-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-review-candidate
          path: /tmp/source-review-candidate.tar
          retention-days: 1
