name: Prepare source-review guide
on:
  push:
    branches: [codex/reader-value-20261012]
    paths: [.github/workflows/reader-value-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/reader-value-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Keep step links visibly separated and test their target sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/summary-review.css')
          assert '.entry-jumps' not in p.read_text()
          p.write_text(p.read_text() + '.page-ai-summary-review .entry-jumps { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin: 1.2rem 0; }\n.page-ai-summary-review .entry-jumps a { display: inline-flex; align-items: center; min-height: 44px; }\n')
          p = Path('_tests/summary_review_browser.py')
          s = p.read_text()
          old = "    expect(page.locator('h1')).to_be_visible()"
          assert old in s
          s = s.replace(old, old + "\n    assert page.locator('.entry-jumps').evaluate('(el)=>getComputedStyle(el).display')=='flex'\n    for link in page.locator('.entry-jumps a').all():\n     assert link.bounding_box()['height']>=44")
          p.write_text(s)
          PY
      - name: Rebuild and verify the focused correction
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          python -m unittest discover -s _tests -p test_summary_review.py -v
      - name: Commit content without changing workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Separate summary-review step links and protect touch targets'
          git push origin HEAD:refs/heads/codex/reader-value-20261012
          git archive --format=tar --output=/tmp/source-review-candidate.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-review-candidate
          path: /tmp/source-review-candidate.tar
          retention-days: 1
