name: Prepare reviewed search release
on:
  push:
    branches: [codex/search-identity-20261011]
    paths: [.github/workflows/search-release-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/search-identity-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover the exact candidate patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = ''.join((Path('_search-release') / ('chunk-' + str(i) + '.txt')).read_text() for i in range(5))
          assert len(encoded) == 29464
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '0bd0c9dcb856e77943f3b5a661ea34fd84cab04b49efb37df15225e51e933df9'
          Path('/tmp/search-release.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero /tmp/search-release.patch
          git apply --unidiff-zero /tmp/search-release.patch
      - name: Render cards and build the candidate
        run: |
          python -m pip install Pillow==12.3.0
          python _scripts/render_social_cards.py --only practical-ai task-brief
          python _scripts/build.py
          python _scripts/build.py --check
          python _scripts/check_search.py
          git add -A
          git archive --format=tar --output=/tmp/search-candidate-source.tar "$(git write-tree)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-search-candidate
          path: /tmp/search-candidate-source.tar
          retention-days: 1
      - name: Verify candidate content
        run: python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Commit content without changing workflows
        run: |
          git restore --source=HEAD --staged --worktree .github
          rm -rf _search-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Improve search identity and practical AI evidence'
          git push origin HEAD:refs/heads/codex/search-identity-20261011
