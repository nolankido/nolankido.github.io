name: Publish verified personal home once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-personal-home.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verified-personal-home-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15-intel
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release and package only approved public files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = main
          test "$(gh api repos/nolankido/nolankido.github.io/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
          python - <<'PY'
          from pathlib import Path
          import io, os, subprocess, sys, tarfile
          root = Path.cwd()
          sys.path.insert(0, str(root / '_scripts'))
          import build
          generated = build.build_outputs()
          files = list(generated)
          files += [Path(p) for p in ['styles.css', 'assets/site.css', 'assets/contact.js', 'favicon.svg', 'robots.txt', 'CNAME', 'card/qr.svg', '.well-known/security.txt']]
          files += [Path('downloads') / (slug + '.md') for slug in ['decision-record', 'tool-trust-check', 'learning-loop']]
          release = '588ed6d1de350500a9a9f1ffdc0f4c81738e24ca'
          archive = Path(os.environ['RUNNER_TEMP']) / 'artifact.tar'
          with tarfile.open(archive, 'w', format=tarfile.USTAR_FORMAT) as out:
              for relative in sorted(set(files)):
                  source = root / relative
                  assert source.is_file() and not source.is_symlink(), relative
                  data = source.read_bytes()
                  expected = subprocess.check_output(['git', 'show', release + ':' + relative.as_posix()])
                  assert data == expected, 'Public content differs from the verified release: ' + str(relative)
                  if relative in generated:
                      assert data == generated[relative].encode('utf-8'), relative
                  entry = tarfile.TarInfo('./' + relative.as_posix())
                  entry.size, entry.mode, entry.mtime = len(data), 0o644, 0
                  out.addfile(entry, io.BytesIO(data))
          print('Packaged', len(set(files)), 'approved public files, each byte-matched to release', release)
          PY
      - name: Upload the Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Verify branch is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/nolankido/nolankido.github.io/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - name: Publish through the existing GitHub Pages environment
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
