name: Living Well expansion preview
on:
  push:
    branches: [living-well-reading-expansion-20261009]
permissions:
  contents: read
concurrency:
  group: living-well-reading-expansion
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/living-well-reading-expansion-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the checksum-bound and allowlisted source patch
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path
          allowed = {
              '_scripts/living_well.py', '_scripts/living_well_resources.py',
              '_source/living-well/expansion.json', '_source/living-well/further.json',
              '_source/living-well/resources.json', '_source/living-well/READING_EXPANSION_RELEASE.md',
              '_tests/living_well_browser.py', '_tests/test_living_well.py',
              '_tests/test_living_well_resources.py', '_tests/test_living_well_expansion.py',
              'assets/living-well.css',
          }
          encoded = ''.join(Path(f'_scripts/lw-expansion-transfer-{i}.txt').read_text().strip() for i in (1, 2))
          # Repair one identified transfer transcription error, then require the original payload digest.
          wrong, correct = 'M25cWbR2Tx4tVuKbR6Ty', 'M25cWbR/ltTx4tVuKbR2Ty'
          if wrong in encoded:
              assert encoded.count(wrong) == 1
              encoded = encoded.replace(wrong, correct)
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a6ebf5dad474953e48cb94fd64f4e838ca0d418ffbfd39447577c80fe7e78db0', 'Source payload digest mismatch'
          payload = json.loads(raw)
          assert payload['version'] == 1
          assert payload['base_commit'] == '1d79d4e8ef4bbce59ee166a01b52ae62a927eca4'
          assert set(payload['files']) == allowed
          subprocess.run(['git', 'merge-base', '--is-ancestor', payload['base_commit'], 'HEAD'], check=True)
          for name, hashes in payload['files'].items():
              path = Path(name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual == hashes['before'], f'Changed source baseline: {name}'
          patch = Path(os.environ['RUNNER_TEMP']) / 'living-well-reviewed.patch'
          patch.write_text(payload['patch'], encoding='utf-8')
          changes = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          assert {line.split('\t', 2)[2] for line in changes.splitlines()} == allowed
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for name, hashes in payload['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == hashes['after'], name
          print('Applied eleven reviewed source files; all before and after hashes match.')
          PY
      - name: Build and run all automated regressions
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/living-well-expansion-checks"
          python _scripts/build.py
          python _scripts/build.py --check 2>&1 | tee "$RUNNER_TEMP/living-well-expansion-checks/build.log"
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/living-well-expansion-checks/unit.log"
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Verify reading routes and whole-site accessibility
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/living-well-expansion-checks
        run: |
          set -o pipefail
          python _tests/living_well_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-expansion-checks/browser.log"
          python _tests/review_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-expansion-checks/review.log"
      - name: Commit tested output to this review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'living-well-reading-expansion-20261009'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          python - <<'PY'
          import subprocess
          allowed = {
              '_scripts/living_well.py', '_scripts/living_well_resources.py',
              '_source/living-well/expansion.json', '_source/living-well/further.json',
              '_source/living-well/resources.json', '_source/living-well/READING_EXPANSION_RELEASE.md',
              '_tests/living_well_browser.py', '_tests/test_living_well.py',
              '_tests/test_living_well_resources.py', '_tests/test_living_well_expansion.py',
              'assets/living-well.css', 'sitemap.xml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert all(p in allowed or p.startswith('living-well/') for p in changed), sorted(changed - allowed)
          print('Verified release scope:', len(changed), 'files. Other sections and global assets unchanged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'content: publish verified Living Well reading expansion'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/living-well-expansion-checks/verified-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: living-well-expansion-checks
          path: |
            ${{ runner.temp }}/living-well-expansion-checks/*.log
            ${{ runner.temp }}/living-well-expansion-checks/*.json
            ${{ runner.temp }}/living-well-expansion-checks/*.txt
            ${{ runner.temp }}/living-well-expansion-checks/living-well-*.png
          retention-days: 1
          if-no-files-found: warn
