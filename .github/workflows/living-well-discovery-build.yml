name: Living Well discovery verification
on:
  push:
    branches: [living-well-free-discovery-20261009]
permissions:
  contents: read
concurrency:
  group: living-well-free-discovery
  cancel-in-progress: false
jobs:
  discovery:
    if: github.ref == 'refs/heads/living-well-free-discovery-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply checksum-bound, allowlisted source changes
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          before = {
              '_scripts/living_well.py': '6461485172b5f880d4b28cb0e44eb3c498c891c24702903f17319cf3090f39ef',
              '_source/living-well/launch.json': 'b09aaa0aa469ab8062269e84062033ba66d0b4538a3ec6e1beefe3d2a652ac83',
              '_source/living-well/further.json': '248a4043b8662b656a977141dc88fc2e37083b9ef341c39c7db96fa43bc16eff',
              'assets/living-well.css': 'a632b814a690c39a6cbc5a228fbdd4c4ae52e1069669881c63c8279e31c6e6aa',
              '_tests/test_living_well.py': 'f6861a4fd2621d8fead5279c0253ef894a3d13838a7b4e8bcac1ed32e64f11af',
              '_tests/living_well_browser.py': 'd8ee9aef5091b95bc0110af2d3f43516ca4d95081fcf80ce9c06e33ad655bbfe'
          }
          added = {'_scripts/living_well_resources.py', '_source/living-well/discovery.json',
                   '_source/living-well/resources.json', '_source/living-well/DISCOVERY_RELEASE.md',
                   '_tests/test_living_well_resources.py'}
          for path, expected in before.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, ('Source moved', path)
          for path in added:
              assert not Path(path).exists(), ('New path already exists', path)
          encoded = ''.join(Path('_source/living-well/_transfer_part' + str(i) + '.txt').read_text().strip() for i in [1, 2])
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6af4e4c639eac13c39190e698c4c082a9a397dbc674e80d3f98d6324d65aabd2', 'Transfer checksum mismatch'
          temp = Path(os.environ['RUNNER_TEMP']) / 'living-well-discovery.patch'
          temp.write_bytes(patch)
          paths = {line.split('\t')[2] for line in subprocess.check_output(['git', 'apply', '--numstat', str(temp)], text=True).splitlines()}
          assert paths == set(before) | added, ('Unexpected source scope', paths)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(temp)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(temp)], check=True)
          print('Verified source transfer applied to eleven allowed Living Well paths.')
          PY
      - name: Deterministic build and all unit regressions
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/living-well-discovery"
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/living-well-discovery/unit.log"
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Verify navigation, accessibility, resources and downloads
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/living-well-discovery
        run: |
          set -o pipefail
          python _tests/living_well_browser.py 2>&1 | tee "$RUNNER_TEMP/living-well-discovery/browser.log"
      - name: Commit only verified source and output to review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'living-well-free-discovery-20261009'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _scripts/living_well.py _scripts/living_well_resources.py _source/living-well/launch.json _source/living-well/further.json _source/living-well/discovery.json _source/living-well/resources.json _source/living-well/DISCOVERY_RELEASE.md assets/living-well.css _tests/test_living_well.py _tests/test_living_well_resources.py _tests/living_well_browser.py living-well sitemap.xml
          git commit -m 'feat: publish verified Living Well free resources and casual-reader paths'
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/living-well-discovery/verified-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: living-well-discovery-checks
          path: ${{ runner.temp }}/living-well-discovery/
          retention-days: 1
          if-no-files-found: warn
