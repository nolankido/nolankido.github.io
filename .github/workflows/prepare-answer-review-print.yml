name: Apply answer review print turn

on:
  push:
    branches:
      - website-growth-answer-review-print-20261025

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat _prep/answer-review-print.part00 _prep/answer-review-print.part01 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/answer-review-print.patch
          git apply --check /tmp/answer-review-print.patch
          git apply --index /tmp/answer-review-print.patch
          git rm _prep/answer-review-print.part00 _prep/answer-review-print.part01
          git rm .github/workflows/prepare-answer-review-print.yml
      - name: Run focused release checks
        shell: bash
        run: |
          set -euo pipefail
          python _scripts/build.py --check
          PYTHONPATH=_tests:_scripts python -m unittest \
            _tests.test_answer_review_print \
            _tests.test_best_five_history \
            _tests.test_answer_review -v
          git diff --cached --check
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make AI answer review printing complete'
          git push origin HEAD:website-growth-answer-review-print-20261025
