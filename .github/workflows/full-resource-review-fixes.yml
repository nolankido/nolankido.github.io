name: Poker review edge cases
on:
  push:
    branches: [poker-full-resource-20261008]
permissions:
  contents: write
concurrency:
  group: poker-review-edge-cases
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-full-resource-20261008
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact reviewed repairs and regressions
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'poker-full-resource-20261008'
          mkdir -p "$RUNNER_TEMP/review-fixes"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'assets/poker-finder.js':'e35f3696d53736bff0ae3902432e78d2beb1b7182a0e732fa601d6076a73d92a',
            'assets/poker-study-tools.js':'7952d2d5f202d88f9199b3192fbef466cf81b1fb932f00a021ff192457eb30bb',
            '_source/poker/study-calculators.html':'2628c27d040179d04023ab82555e4581a6b108bf4d6d73c2fbe421ed8694d7fa',
            '_tests/full_resource_browser.py':'9960bd4b5d5827dab98c617e426127caccb831663fb24ea0b2cc67e265ec1a8f',
            '_tests/test_full_resource.py':'c9703e05d315bb8b1a14e96f1e9ef9ea92c248a577d55f2c93e876801be413b5'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, name
          def change(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old)
              p.write_text(s.replace(old,new))
          change('assets/poker-finder.js','excerpt.hidden = !found; jump.hidden = !found;',
                 'excerpt.hidden = !found;\n      // A matching passage without an anchor has no honest section jump.\n      jump.hidden = !found || !selected.p.dataset.anchor;')
          change('assets/poker-finder.js',
                 "        link.setAttribute('href', card.url + (selected.p.dataset.anchor ? '#' + selected.p.dataset.anchor : ''));\n        link.textContent = 'Read: ' + selected.p.dataset.heading;",
                 "        if (selected.p.dataset.anchor) {\n          link.setAttribute('href', card.url + '#' + selected.p.dataset.anchor);\n          link.textContent = 'Read: ' + selected.p.dataset.heading;\n        } else {\n          link.removeAttribute('href');\n          link.textContent = '';\n        }")
          change('assets/poker-study-tools.js',
                 "    if (a <= 0 || b <= 0) throw new Error('The pot and call or risk must both be greater than zero.');",
                 "    if (a <= 0) throw new Error('The pot must be greater than zero.');\n    // No outstanding wager is a valid pot-limit first bet or free option.\n    if ((mode === 'call' || mode === 'bluff') && b <= 0) throw new Error('The call or risk must be greater than zero.');")
          change('_source/poker/study-calculators.html',
                 'The extra call is what you must add now. This computes',
                 'The extra call is what you must add now. Enter 0 when there is no outstanding amount to call, including a first bet or a free option. This computes')
          change('_tests/test_full_resource.py',
                 "        inputs.append(['potlimit','500','70','80'])",
                 "        inputs.extend([['potlimit','500','70','80'], ['potlimit','100','0','0'], ['potlimit','100','0','10']])")
          change('_tests/test_full_resource.py',
                 "for args in [['call','0','1'],['bluff','1','0'],['potlimit','10','1','11'],['wrong','1','2']]:",
                 "for args in [['call','0','1'],['call','100','0'],['bluff','1','0'],['potlimit','0','0','0'],['potlimit','10','1','11'],['wrong','1','2']]:")
          change('_tests/full_resource_browser.py',
                 "        original_url=page.url;initial=len(traffic)",
                 "        original_url=page.url;initial=len(traffic)\n        # A real unanchored h2 remains searchable, but must not promise a jump.\n        page.locator('#finder-search').fill('references limits')\n        page.locator('#finder-search').press('Enter')\n        unanchored=page.locator('[data-id=\"poker-pot-odds-workshop\"]')\n        expect(unanchored).to_be_visible()\n        expect(unanchored.locator('.finder-excerpt')).to_be_visible()\n        expect(unanchored.locator('.finder-jump')).to_be_hidden()\n        assert unanchored.locator('.finder-jump a').get_attribute('href') is None\n        page.locator('#finder-reset').click()")
          change('_tests/full_resource_browser.py',
                 "        panel=page.locator('[data-study-tool=\"potlimit\"]')\n        for field,value in zip(panel.locator('input').all(),['500','70','80']):field.fill(value)",
                 "        panel=page.locator('[data-study-tool=\"potlimit\"]')\n        for committed,total in [('0','100'),('10','110')]:\n            for field,value in zip(panel.locator('input').all(),['100','0',committed]):field.fill(value)\n            panel.locator('[data-tool-run]').click()\n            expect(panel.locator('[data-tool-output]')).to_contain_text('Maximum new chips to put in: 100.')\n            expect(panel.locator('[data-tool-output]')).to_contain_text('including existing chips: '+total+'.')\n        for mode in ['call','bluff']:\n            other=page.locator('[data-study-tool=\"'+mode+'\"]')\n            other.locator('input').nth(1).fill('0');other.locator('[data-tool-run]').click()\n            expect(other.locator('[data-tool-output]')).to_contain_text('Check the inputs')\n        for field,value in zip(panel.locator('input').all(),['500','70','80']):field.fill(value)")
          print('Applied both review repairs with exact input identity checks.')
          PY
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/review-fixes/unit-tests.log"
          node --check assets/poker-finder.js
          node --check assets/poker-study-tools.js
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/fixes-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Run actual reader regressions
        env:
          AXE_PATH: ${{ runner.temp }}/fixes-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/review-fixes
        run: |
          set -euo pipefail
          for suite in finder_browser topics_browser full_resource_browser; do
            python "_tests/$suite.py" 2>&1 | tee "$SCREENSHOT_DIR/$suite.log"
          done
      - name: Commit verified repairs to feature branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-full-resource-20261008'
          git diff --exit-code HEAD -- .github index.html _source/home.html _source/layout.html _source/site.json assets/contact.js assets/site.css styles.css
          git add assets/poker-finder.js assets/poker-study-tools.js _source/poker/study-calculators.html _tests/test_full_resource.py _tests/full_resource_browser.py poker
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix unanchored passage jumps and accept pot-limit free options'
          git push origin HEAD:refs/heads/poker-full-resource-20261008
          git archive --format=tar HEAD > "$RUNNER_TEMP/review-fixes/reviewed-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/review-fixes/commit.txt"
      - name: Save evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-review-fixes
          path: ${{ runner.temp }}/review-fixes/
          retention-days: 1
          if-no-files-found: error
