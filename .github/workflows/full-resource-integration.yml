name: Poker integration review
on:
  push:
    branches: [poker-full-resource-20261008]
permissions:
  contents: write
concurrency:
  group: poker-full-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-full-resource-20261008
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Integrate only the reviewed main revision and exact resolutions
        env:
          REVIEW_DIR: ${{ runner.temp }}/integration-review
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'poker-full-resource-20261008'
          test "$(git rev-parse origin/main)" = 'ba25df088914971f0ed6b50c49feccc8bd0b6806'
          mkdir -p "$REVIEW_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main > "$REVIEW_DIR/merge.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,re,shutil,subprocess,zlib
          out=Path(os.environ['REVIEW_DIR'])
          parts=[]
          for i in (1,2):
              path=Path(f'_scripts/topic-integration-{i}.b64')
              shutil.copyfile(path,out/path.name)
              parts.append(''.join(path.read_text().split()))
          encoded=''.join(parts)
          # Remove one observed duplicated transport span. The original checksum
          # remains mandatory; no modified or partially recovered source is used.
          encoded,n=re.subn(r'(N1J9EYt)SWQAM.*?N1J9EYt(?=8Nk)',r'\1',encoded,count=1)
          if n!=1:raise SystemExit('Expected the recorded transport duplication')
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='565b5da13d9d19a9e21d1f1c5a52492a98fb0cb79d16e22ff6049c69e5572beb':
              raise SystemExit('Resolution source checksum mismatch')
          payload=json.loads(raw)
          for record in payload['records']:
              p=Path(record['path'])
              if hashlib.sha256(p.read_bytes()).hexdigest()!=record['before']:
                  raise SystemExit('Unreviewed merge input: '+str(p))
          patch=out/'resolved.patch';patch.write_text(payload['patch'])
          subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
          for record in payload['records']:
              if hashlib.sha256(Path(record['path']).read_bytes()).hexdigest()!=record['after']:
                  raise SystemExit('Resolution output mismatch: '+record['path'])
          for i in (1,2):Path(f'_scripts/topic-integration-{i}.b64').unlink()
          print('PASS exact integration source and every before/after file hash')
          PY
          # The runner never updates workflow files. The combined CI loop is
          # applied through the connected GitHub write action after this review.
          git restore --source=HEAD --staged --worktree .github/workflows/site-checks.yml
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$REVIEW_DIR/unit-tests.log"
          node --check assets/poker-finder.js
          node --check assets/poker-study-tools.js
          git diff --exit-code HEAD -- .github index.html _source/home.html _source/layout.html _source/site.json _source/poker/catalog.json assets/contact.js assets/site.css assets/poker.css assets/hubs.css styles.css _config.yml
      - name: Install browser and accessibility tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/integration-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Verify old topics and new reader tasks together
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/integration-review
          AXE_PATH: ${{ runner.temp }}/integration-qa/node_modules/axe-core/axe.min.js
        run: |
          set -euo pipefail
          for suite in finder_browser topics_browser full_resource_browser; do
            python "_tests/$suite.py" 2>&1 | tee "$SCREENSHOT_DIR/$suite.log"
          done
      - name: Commit the verified integration to the feature branch only
        env:
          REVIEW_DIR: ${{ runner.temp }}/integration-review
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-full-resource-20261008'
          git add README.md _source _scripts _tests _reports assets downloads poker sitemap.xml
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'Integrate live topic architecture with full-text discovery and study tools'
          git push origin HEAD:refs/heads/poker-full-resource-20261008
          git archive --format=tar HEAD > "$REVIEW_DIR/combined-source.tar"
          git rev-parse HEAD > "$REVIEW_DIR/commit.txt"
      - name: Save integration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poker-integration-review
          path: ${{ runner.temp }}/integration-review/
          retention-days: 1
          if-no-files-found: error
