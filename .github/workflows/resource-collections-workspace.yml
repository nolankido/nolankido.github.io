name: Resource collections workspace
on:
  push:
    branches: [poker-resource-collections-20261008]
permissions:
  contents: write
concurrency:
  group: resource-collections-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/poker-resource-collections-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poker-resource-collections-20261008
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source patch and prepare educational content
        env:
          REVIEW_DIR: ${{ runner.temp }}/collections-review
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'poker-resource-collections-20261008'
          mkdir -p "$REVIEW_DIR/payload"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os, shutil, subprocess, zlib
          out = Path(os.environ['REVIEW_DIR'])
          hashes = [
            'c31581941040b6995345013a792b659335f97dcc5b707c88847ae8fb1929b320',
            'eb3088a3a6100fa6303cb480603dfc3e8a95f0f6d9b6c6e414ef20fc18871eda',
            'cbb6b5920f14b661cba53cba58261052e466dd1eb28e0c88c104c43cc0d56cc9',
            'a7b7034fe25bce748c308b0267c6076d190e9d653da9ef3330f2056a5b6ae0fd',
            '613b260e2ebcfe017fd0d0e906a94a9503b8093e5b0c90205691f6f4f87643e7']
          patches, errors = [], []
          for i, expected in enumerate(hashes, 1):
              source = Path(f'_scripts/collections-part-{i}.b64')
              if not source.exists():
                  errors.append(f'Missing source part {i}')
                  continue
              shutil.copyfile(source, out / 'payload' / source.name)
              encoded = ''.join(source.read_text().split())
              # Repair identified transport transcription errors, then require the
              # original local SHA-256. No differing patch may be applied.
              if i == 1:
                  encoded = encoded.replace('vE6TI6TIrq', 'vE6TIrq').replace('C5r4o0Oe8', 'C5r0Oe8').replace('JLbrpJLpIq', 'JLbrpIq')
              if i == 2:
                  encoded = encoded.replace('+HJM9Xsnh', '+HJM9Vsnh')
              try:
                  patch = zlib.decompress(base64.b64decode(encoded, validate=True))
                  digest = hashlib.sha256(patch).hexdigest()
                  if digest != expected:
                      raise ValueError(f'SHA-256 {digest} does not match {expected}')
                  target = out / f'part-{i}.patch'
                  target.write_bytes(patch)
                  patches.append(str(target))
                  print(f'PASS exact source part {i}: {digest}', flush=True)
              except Exception as exc:
                  errors.append(f'Part {i}: {exc}')
          if errors:
              (out / 'transfer-errors.txt').write_text('\n'.join(errors))
              raise SystemExit('\n'.join(errors))
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', *patches], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', *patches], check=True)
          for source in Path('_scripts').glob('collections-part-*.b64'):
              source.unlink()
          PY
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          git diff --exit-code HEAD -- index.html _source/home.html _source/layout.html _source/site.json _source/poker/catalog.json assets styles.css _config.yml
      - name: Install browser test requirements
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check collection navigation, mobile, print and exports
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/collections-review
        run: |
          set -euo pipefail
          python _tests/collections_browser.py 2>&1 | tee "$SCREENSHOT_DIR/collections-browser.log"
      - name: Commit verified source and generated output to feature branch only
        env:
          REVIEW_DIR: ${{ runner.temp }}/collections-review
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'poker-resource-collections-20261008'
          # This runner may publish content but may not update workflow files.
          # The normal CI addition is reviewed and applied separately.
          git restore .github/workflows/site-checks.yml
          git add _source _scripts _tests _reports downloads poker sitemap.xml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Expand Poker resources with guided collections and portable exports'
          git push origin HEAD:refs/heads/poker-resource-collections-20261008
          git archive --format=tar HEAD > "$REVIEW_DIR/collections-reviewed.tar"
          git rev-parse HEAD > "$REVIEW_DIR/commit.txt"
      - name: Save verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-collections-review
          path: ${{ runner.temp }}/collections-review/
          retention-days: 1
          if-no-files-found: error
