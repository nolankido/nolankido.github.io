name: Finalize native sharing status
on:
  push:
    branches: [codex/reading-delivery-20261012]
    paths: [.github/workflows/reading-status-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/codex/reading-delivery-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the reviewed status wording and exact expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['assets/page-sharing.js', '_tests/reading_delivery_browser.py']:
              p = Path(filename)
              text = p.read_text()
              before = 'Sharing dialog completed.'
              after = 'Sharing request accepted by your device.'
              assert text.count(before) == 1, filename
              p.write_text(text.replace(before, after))
          p = Path('_tests/test_poker_content.py')
          text = p.read_text()
          before = "BASELINE_DIGEST = 'a20c3d6935f1b2d2af18f65f9f0214e52d47c968d1fbc70b28fece41d92b46ca'"
          after = "BASELINE_DIGEST = '049304d67f1bc43dd944e12ca1a852a8f9487911133643d01caa609e84147ab5'"
          assert text.count(before) == 1
          p.write_text(text.replace(before, after))
          PY
      - name: Rebuild and check exact content and preservation
        run: |
          python -m pip install -r requirements-test.txt
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python _scripts/check_search.py
          node --check assets/page-sharing.js
          python -m unittest discover -s _tests -p test_reading_delivery.py -v
          python -m unittest discover -s _tests -p test_poker_content.py -v
      - name: Commit the reviewed content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'Describe native-share acceptance without claiming delivery'
          git push origin HEAD:refs/heads/codex/reading-delivery-20261012
