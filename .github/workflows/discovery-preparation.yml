name: Prepare cross-interest search
on:
  push:
    branches: [site/cross-interest-search-20261011]
    paths:
      - _scripts/discovery-patch.part*
      - .github/workflows/discovery-preparation.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/site/cross-interest-search-20261011'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify reviewed source patch and build
        shell: bash
        run: |
          set -euo pipefail
          cat _scripts/discovery-patch.part0{1,2,3,4,5,6,7} > "$RUNNER_TEMP/discovery.patch.gz"
          echo "b5aa41d2a75eeea9940dcbbf21c3d9c270e0829df33a9f4ac2c1693bfff9f67b  $RUNNER_TEMP/discovery.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/discovery.patch.gz" > "$RUNNER_TEMP/discovery.patch"
          git apply --check "$RUNNER_TEMP/discovery.patch"
          git apply "$RUNNER_TEMP/discovery.patch"
          python _scripts/build.py
          python _scripts/build.py --check
      - name: Unit and content regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/discovery-unit.log"
      - name: Commit site files to isolated review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='site/cross-interest-search-20261011'
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          git rm _scripts/discovery-patch.part0{1,2,3,4,5,6,7}
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git diff --cached --stat > "$RUNNER_TEMP/discovery-changes.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add local-only cross-interest search and clear discovery routes'
          git rev-parse HEAD > "$RUNNER_TEMP/discovery-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/discovery-release.tar.gz"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: discovery-prepared
          path: |
            ${{ runner.temp }}/discovery-unit.log
            ${{ runner.temp }}/discovery-changes.txt
            ${{ runner.temp }}/discovery-head.txt
            ${{ runner.temp }}/discovery-release.tar.gz
          retention-days: 1
