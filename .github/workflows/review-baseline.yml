name: Verify whole-site review fixes
on:
  push:
    branches: [site-review-20261005]
permissions:
  contents: write
concurrency:
  group: site-review-staging
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare and check source
        run: |
          python _scripts/review_prepare.py
          python _scripts/build.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
          node --check assets/contact.js
      - name: Install browser and accessibility tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Existing regression suites
        run: |
          python _tests/browser.py
          python _tests/design_browser.py
      - name: Real font checks
        env:
          ALLOW_WEB_FONTS: '1'
        run: python _tests/design_browser.py
      - name: Comprehensive accessibility and failure recovery
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
        run: python _tests/review_browser.py
      - name: Commit generated pages and checked contracts to staging only
        run: |
          test "$GITHUB_REF_NAME" = 'site-review-20261005'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _source _scripts/build.py _tests requirements-test.txt _config.yml index.html about bio card contact privacy 404.html notes resources feed.xml sitemap.xml nolan-kido.vcf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate and verify reviewed contact recovery and accessible content'
            git push origin HEAD:refs/heads/site-review-20261005
          fi
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
          echo "VERIFIED_TREE=$(git rev-parse HEAD^{tree})"
