name: Poker review snapshot
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'codex/poker-whole-site-usability-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive committed source for isolated review
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/overview-source.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overview-source
          path: ${{ runner.temp }}/overview-source.zip
          retention-days: 1
          if-no-files-found: error
