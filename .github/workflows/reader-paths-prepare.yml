name: Reader paths preparation
on:
  push:
    branches: [codex/reader-paths-20261011]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed sources and validate
        run: |
          python _scripts/prepare_reader_paths.py
          python _scripts/build.py --check
          python -m unittest discover -s _tests -p 'test_*.py' -v
      - name: Install browser tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/nk-qa" --no-audit --no-fund axe-core@4.10.3
      - name: Exercise native first-step journeys
        env:
          AXE_PATH: ${{ runner.temp }}/nk-qa/node_modules/axe-core/axe.min.js
          SCREENSHOT_DIR: ${{ runner.temp }}/first-step-previews
        run: |
          mkdir -p "$RUNNER_TEMP/first-step-previews"
          set -o pipefail
          python _tests/first_steps_browser.py 2>&1 | tee "$RUNNER_TEMP/first-step-previews/checks.log"
      - name: Save reviewed source on feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'codex/reader-paths-20261011'
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/reader-paths-20261011" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'Nolan Kido'
          git config user.email '212063387+nolankido@users.noreply.github.com'
          git add _source _scripts/build.py _scripts/check_live.py _tests assets/first-steps.css downloads/creative-brief.txt index.html creative/index.html resources/index.html find/index.html _reports/first-steps-20261011.md
          git commit -m 'Give each interest a useful first step and build out Creative Work'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/reader-paths-20261011
          git archive --format=tar HEAD > "$RUNNER_TEMP/first-step-previews/prepared-source.tar"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: prepared-first-steps
          path: ${{ runner.temp }}/first-step-previews/
          retention-days: 1
          if-no-files-found: warn
