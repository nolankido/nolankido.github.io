name: Temporary Turn 08 source snapshot
on:
  push:
    branches: [website-growth-turn08-time-decisions-20261017]
    paths: [.github/workflows/turn08-source-export.yml]
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e6d61d4070bae76c54e1b676422e716ff8adaac6
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/main-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turn08-source
          path: ${{ runner.temp }}/main-source.tar.gz
          retention-days: 1
