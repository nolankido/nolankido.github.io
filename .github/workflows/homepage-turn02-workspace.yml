name: Temporary homepage source workspace
on:
  push:
    branches: [improve-homepage-growth-turn02-20261017]
    paths: [.github/workflows/homepage-turn02-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8f63c0436a45256cb2987cd93f77a9ef6e85df1b
          persist-credentials: false
      - name: Package tracked files from the approved public revision
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/homepage-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homepage-turn02-source
          path: ${{ runner.temp }}/homepage-source.tar.gz
          retention-days: 1
          if-no-files-found: error
