name: Temporary Poker School isolated build and browser validation
on:
  push:
    branches: [improve-poker-school-interest-20261016]
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python and browser dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild and verify focused change
        run: |
          python _scripts/build.py
          python _scripts/build.py --check
          python _tests/check_html5.py
          python -m unittest discover -s _tests -p 'test_poker_school.py' -v
          node --check assets/poker-school-interest.js
          node --check assets/contact.js
          python _tests/browser.py
      - name: Commit deterministic generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize generated pages after isolated Poker School form"
            git push origin HEAD:improve-poker-school-interest-20261016
          fi
