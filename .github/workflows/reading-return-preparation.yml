name: Prepare reading and return paths
on:
  push:
    branches: [site/reading-return-20261011]
    paths:
      - _scripts/return-patch.part*
      - .github/workflows/reading-return-preparation.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'nolankido/nolankido.github.io' && github.ref == 'refs/heads/site/reading-return-20261011'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify reviewed patch and build
        shell: bash
        run: |
          set -euo pipefail
          cat _scripts/return-patch.part0{1,2,3,4,5,6,7,8} > "$RUNNER_TEMP/reading-return.patch.gz"
          echo "805d1741b341207f083342844d16b118c6f6df8dedc254d68858f82318e1af9b  $RUNNER_TEMP/reading-return.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/reading-return.patch.gz" > "$RUNNER_TEMP/reading-return.patch"
          git apply --check "$RUNNER_TEMP/reading-return.patch"
          git apply "$RUNNER_TEMP/reading-return.patch"
          python _scripts/build.py
          python _scripts/build.py --check
      - name: Unit and content regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s _tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/reading-return-unit.log"
      - name: Commit site files to isolated review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='site/reading-return-20261011'
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          git rm _scripts/return-patch.part0{1,2,3,4,5,6,7,8}
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git diff --cached --stat > "$RUNNER_TEMP/reading-return-changes.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Help readers follow, navigate and keep the published writing'
          git rev-parse HEAD > "$RUNNER_TEMP/reading-return-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/reading-return-release.tar.gz"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reading-return-prepared
          path: |
            ${{ runner.temp }}/reading-return-unit.log
            ${{ runner.temp }}/reading-return-changes.txt
            ${{ runner.temp }}/reading-return-head.txt
            ${{ runner.temp }}/reading-return-release.tar.gz
          retention-days: 1
